<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokoro TTS PDF Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  /* ─── Themes ─── */
  :root[data-theme="light"] {
    --bg: #f3f3f3; --surface: #ffffff; --surface-2: #ececec; --border: #d4d4d4;
    --text: #1a1a1a; --muted: #6b6b6b; --accent: #2563eb; --accent-light: #3b82f6;
    --highlight: rgba(255, 196, 0, 0.30); --highlight-active: rgba(255, 153, 0, 0.55);
    --highlight-done: rgba(160, 160, 160, 0.20);
    --pdf-filter: none; --pdf-bg: #525252; --dock-bg: #ffffff; --input-bg: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #0f0f1a; --surface: #1a1a2e; --surface-2: #252545; --border: #2a2a4a;
    --text: #e6e6f0; --muted: #8888a8; --accent: #7c3aed; --accent-light: #a78bfa;
    --highlight: rgba(255, 200, 60, 0.22); --highlight-active: rgba(255, 200, 60, 0.55);
    --highlight-done: rgba(140, 140, 180, 0.12);
    --pdf-filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.95);
    --pdf-bg: #0a0a12; --dock-bg: #1a1a2e; --input-bg: #252545;
  }
  :root[data-theme="sepia"] {
    --bg: #f1e7d0; --surface: #ece0c4; --surface-2: #dccfa8; --border: #b8a378;
    --text: #4a3520; --muted: #7a6240; --accent: #b45309; --accent-light: #d97706;
    --highlight: rgba(220, 130, 30, 0.28); --highlight-active: rgba(220, 110, 20, 0.55);
    --highlight-done: rgba(170, 130, 80, 0.22);
    --pdf-filter: sepia(0.55) brightness(0.97) contrast(0.92) saturate(0.85);
    --pdf-bg: #c8b48a; --dock-bg: #ece0c4; --input-bg: #dccfa8;
  }
  :root[data-theme="black"] {
    --bg: #000000; --surface: #0c0c0c; --surface-2: #1a1a1a; --border: #2a2a2a;
    --text: #d0d0d0; --muted: #707070; --accent: #6366f1; --accent-light: #818cf8;
    --highlight: rgba(255, 200, 50, 0.30); --highlight-active: rgba(255, 200, 50, 0.60);
    --highlight-done: rgba(80, 80, 80, 0.25);
    --pdf-filter: invert(1) hue-rotate(180deg) brightness(0.8) contrast(1.15);
    --pdf-bg: #000000; --dock-bg: #0c0c0c; --input-bg: #1a1a1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
    transition: background 0.25s, color 0.25s;
  }
  .hidden { display: none !important; }
  button { font-family: inherit; }

  /* ─── Toolbar ─── */
  .toolbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 7px 12px; display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; flex: 0 0 auto; min-height: 46px;
    transition: background 0.25s, border-color 0.25s;
  }
  .toolbar .brand { font-weight: 700; color: var(--accent-light); font-size: 1rem; white-space: nowrap; }
  .toolbar .sep { width: 1px; height: 24px; background: var(--border); flex: 0 0 auto; }
  .toolbar .file-name { color: var(--muted); font-size: 0.82rem; max-width: 180px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar button, .toolbar select, .toolbar input[type="number"] {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 0.8rem; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .toolbar input[type="number"] { width: 56px; text-align: center; cursor: text; }
  .toolbar input[type="range"] { vertical-align: middle; accent-color: var(--accent); }
  .toolbar button:hover:not(:disabled), .toolbar select:hover { background: var(--border); }
  .toolbar button:disabled { opacity: 0.35; cursor: not-allowed; }
  .toolbar label { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .toolbar .muted { color: var(--muted); font-size: 0.85rem; padding: 0 4px; }
  .btn-primary { background: var(--accent) !important; color: white !important; border-color: var(--accent) !important; }
  .btn-primary:hover { background: var(--accent-light) !important; }
  .btn-primary:disabled { background: #555577 !important; border-color: #555577 !important; color: #aaa !important; }
  .toolbar .icon-btn { padding: 5px 9px; min-width: 30px; }
  .toolbar .icon-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .toolbar .group { display: flex; align-items: center; gap: 4px; }

  /* ─── Main PDF area ─── */
  .main { flex: 1; overflow: hidden; display: flex; }
  .pdf-area {
    flex: 1; overflow: auto; background: var(--pdf-bg); padding: 24px;
    display: flex; justify-content: center; align-items: flex-start;
    transition: background 0.25s;
  }
  .page-wrapper {
    position: relative; display: inline-block;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5); border-radius: 2px;
  }
  .page-wrapper canvas { display: block; filter: var(--pdf-filter); border-radius: 2px; }
  .highlight-overlay {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    z-index: 2;
  }
  .highlight-rect {
    position: absolute; background: transparent; border-radius: 2px;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .highlight-rect.active {
    background: var(--highlight-active);
    box-shadow: 0 0 0 2px var(--accent-light), 0 0 16px var(--highlight-active);
    border-bottom: 3px solid var(--accent-light);
    z-index: 2;
  }
  .highlight-rect.done { background: transparent; }

  /* ─── Audio dock ─── */
  .audio-dock {
    background: var(--dock-bg); border-top: 1px solid var(--border);
    flex: 0 0 auto; padding: 8px 16px;
    transition: background 0.25s, border-color 0.25s;
  }
  .dock-row { display: flex; align-items: center; gap: 10px; }
  .dock-row + .dock-row { margin-top: 6px; }
  .dock-row button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
    transition: background 0.15s;
  }
  .dock-row button:hover:not(:disabled) { background: var(--border); }
  .dock-row button:disabled { opacity: 0.4; cursor: not-allowed; }
  .dock-row .play-btn {
    background: var(--accent); color: white; border-color: var(--accent);
    width: 40px; height: 40px; border-radius: 50%; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .dock-row .play-btn:hover:not(:disabled) { background: var(--accent-light); }
  .dock-time { font-variant-numeric: tabular-nums; font-size: 0.82rem; color: var(--muted); min-width: 42px; }
  .dock-progress {
    flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px;
    overflow: hidden; cursor: pointer; position: relative; min-width: 100px;
  }
  .dock-progress:hover { height: 8px; }
  .dock-progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light));
    width: 0%; transition: width 0.1s linear; border-radius: 3px;
  }
  .dock-progress.small { flex: 0 0 200px; height: 4px; }
  .dock-seg { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 56px; text-align: center; }
  .dock-row select {
    background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font-size: 0.8rem;
  }
  .dock-row input[type="range"] { accent-color: var(--accent); width: 90px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
    border-top-color: var(--accent-light); border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gen-text { font-size: 0.8rem; color: var(--muted); }
  .gen-row { font-size: 0.82rem; }

  /* ─── Upload overlay ─── */
  .upload-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000;
    display: flex; align-items: center; justify-content: center; }
  .upload-overlay.hidden { display: none; }
  .upload-box { background: var(--surface); border: 2px dashed var(--border); border-radius: 16px;
    padding: 60px 40px; text-align: center; max-width: 500px; width: 90%; cursor: pointer;
    transition: all 0.3s; }
  .upload-box:hover, .upload-box.dragover { border-color: var(--accent-light); background: var(--surface-2); }
  .upload-box .icon { font-size: 56px; margin-bottom: 16px; }
  .upload-box h2 { margin-bottom: 8px; color: var(--accent-light); }
  .upload-box p { color: var(--muted); font-size: 0.9rem; }
  .upload-box input { display: none; }

  /* ─── Theme indicator & fullscreen ─── */
  body.fullscreen .toolbar { display: none; }
  body.fullscreen .audio-dock { padding: 6px 12px; }

  /* ─── PDF.js text layer (for selection + right-click) ─── */
  .textLayer {
    position: absolute; text-align: initial; inset: 0;
    overflow: hidden; opacity: 1; line-height: 1;
    text-size-adjust: none; forced-color-adjust: none;
    transform-origin: 0 0; z-index: 1;
    pointer-events: auto; user-select: text; -webkit-user-select: text;
  }
  .textLayer span,
  .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; user-select: text; -webkit-user-select: text; }
  .textLayer ::selection { background: rgba(124, 58, 237, 0.35); }
  .textLayer .endOfContent { display: block; }

  /* ─── Color picker popover ─── */
  .color-popover {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 50;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    width: 220px;
  }
  .color-popover .row { display: flex; align-items: center; gap: 8px; }
  .color-popover .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 6px 0 10px; }
  .color-popover .swatch {
    width: 100%; aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent;
    cursor: pointer; padding: 0;
  }
  .color-popover .swatch.active { border-color: var(--accent-light); box-shadow: 0 0 0 2px var(--accent); }
  .color-popover input[type=color] {
    width: 36px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer;
  }
  .color-popover input[type=range] { flex: 1; accent-color: var(--accent); }
  .color-popover label { font-size: 0.75rem; color: var(--muted); }

  /* ─── Right-side hover tab (chat) ─── */
  .hover-tab {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%);
    z-index: 200; display: flex; align-items: center; pointer-events: auto;
  }
  .hover-tab .tab-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px 0 0 8px;
    padding: 14px 8px; cursor: pointer; box-shadow: -2px 4px 14px rgba(0,0,0,0.4);
    writing-mode: vertical-rl; text-orientation: mixed; font-size: 0.78rem;
    display: flex; align-items: center; gap: 6px; transition: padding 0.18s;
  }
  .hover-tab .tab-btn:hover { padding-right: 14px; }
  .hover-tab.open .tab-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-right: none; }
  .hover-tab .tab-icon { font-size: 1rem; writing-mode: horizontal-tb; }

  /* ─── Chat sidebar ─── */
  .chat-sidebar {
    position: fixed; right: 0; top: 0; height: 100vh; width: 420px; z-index: 150;
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform 0.25s ease;
    box-shadow: -8px 0 24px rgba(0,0,0,0.35);
  }
  .chat-sidebar.open { transform: translateX(0); }
  .chat-header {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
  }
  .chat-header h3 { font-size: 0.95rem; color: var(--accent-light); }
  .chat-header .spacer { flex: 1; }
  .chat-header button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 0.82rem;
  }
  .chat-header button:hover { background: var(--border); }
  .chat-sessions {
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px;
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .chat-sessions::-webkit-scrollbar { height: 6px; }
  .chat-sessions::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .chat-chip {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 14px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer;
    white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chat-chip .x { margin-left: 6px; opacity: 0.6; }
  .chat-chip .x:hover { opacity: 1; }
  .chat-meta {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted);
    flex: 0 0 auto; flex-wrap: wrap;
  }
  .chat-meta select {
    background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 6px; font-size: 0.78rem;
  }
  .chat-meta .badge {
    padding: 2px 6px; border-radius: 8px; background: var(--surface-2);
    border: 1px solid var(--border); font-size: 0.7rem;
  }
  .chat-meta .badge.warn { background: rgba(220, 130, 30, 0.15); border-color: rgba(220, 130, 30, 0.35); color: #d97706; }
  .chat-focus {
    margin: 8px 12px 0; padding: 8px 10px; background: var(--surface-2);
    border: 1px solid var(--border); border-left: 3px solid var(--accent-light);
    border-radius: 6px; font-size: 0.78rem; max-height: 100px; overflow-y: auto;
    position: relative;
  }
  .chat-focus .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .chat-focus .text { white-space: pre-wrap; line-height: 1.4; }
  .chat-focus .clear {
    position: absolute; top: 4px; right: 4px; background: transparent;
    border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem;
  }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .chat-msg { display: flex; gap: 8px; max-width: 100%; }
  .chat-msg.user { flex-direction: row-reverse; }
  .chat-msg .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 600; color: #fff;
    background: var(--accent);
  }
  .chat-msg.user .avatar { background: #475569; }
  .chat-msg .bubble {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 12px; font-size: 0.85rem;
    line-height: 1.5; max-width: calc(100% - 50px);
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  .chat-msg.user .bubble { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chat-msg .bubble p { margin: 0 0 6px; }
  .chat-msg .bubble p:last-child { margin-bottom: 0; }
  .chat-msg .bubble code { background: rgba(0,0,0,0.15); padding: 1px 4px; border-radius: 3px; font-size: 0.82em; }
  .chat-msg .bubble pre {
    background: rgba(0,0,0,0.35); padding: 8px 10px; border-radius: 6px; overflow-x: auto;
    font-size: 0.78rem; margin: 6px 0; position: relative;
  }
  .chat-msg .bubble pre code { background: transparent; padding: 0; }
  .chat-msg .bubble ul, .chat-msg .bubble ol { margin: 4px 0 4px 18px; }
  .chat-msg .bubble li { margin: 2px 0; }
  .chat-msg .bubble h1, .chat-msg .bubble h2, .chat-msg .bubble h3 { margin: 8px 0 4px; font-size: 0.95rem; }
  .chat-msg .bubble blockquote {
    border-left: 3px solid var(--accent-light); padding-left: 8px; margin: 6px 0;
    color: var(--muted);
  }
  .chat-msg .bubble .copy-pre {
    position: absolute; top: 4px; right: 4px; background: rgba(255,255,255,0.1);
    color: #fff; border: none; border-radius: 3px; font-size: 0.7rem; padding: 2px 5px; cursor: pointer;
  }
  .chat-msg .bubble .action-tag {
    display: inline-block; font-size: 0.7rem; background: var(--accent); color: #fff;
    padding: 1px 6px; border-radius: 8px; margin-bottom: 4px;
  }
  .chat-msg .focus-tag {
    font-size: 0.7rem; color: var(--muted); font-style: italic; margin-top: 4px;
    border-top: 1px solid var(--border); padding-top: 4px;
  }
  .chat-msg .reasoning {
    background: rgba(180, 130, 30, 0.08); border: 1px solid rgba(180, 130, 30, 0.2);
    border-radius: 6px; padding: 4px 8px; margin: 4px 0; font-size: 0.75rem; color: var(--muted);
  }
  .chat-msg .reasoning summary { cursor: pointer; user-select: none; }
  .chat-typing { padding: 4px 12px; font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .chat-typing .dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); margin: 0 1px; animation: chatDot 1.2s infinite; }
  .chat-typing .dots span:nth-child(2) { animation-delay: 0.15s; }
  .chat-typing .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes chatDot { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
  .chat-jump {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; border: none; border-radius: 14px;
    padding: 4px 12px; font-size: 0.75rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .chat-input-row {
    padding: 8px 12px; border-top: 1px solid var(--border);
    display: flex; gap: 6px; align-items: flex-end; flex: 0 0 auto; position: relative;
  }
  .chat-input-row textarea {
    flex: 1; background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
    font-family: inherit; font-size: 0.85rem; resize: none; min-height: 36px; max-height: 120px;
    outline: none;
  }
  .chat-input-row textarea:focus { border-color: var(--accent-light); }
  .chat-input-row .send-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 0 12px; height: 36px; cursor: pointer; font-size: 1rem;
  }
  .chat-input-row .send-btn:disabled { background: #555577; cursor: not-allowed; opacity: 0.5; }

  /* ─── Right-click context menu ─── */
  .ctx-menu {
    position: fixed; z-index: 9999; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 4px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5); min-width: 200px;
    font-size: 0.85rem;
  }
  .ctx-menu .item {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    cursor: pointer; border-radius: 4px; user-select: none; color: var(--text);
  }
  .ctx-menu .item:hover { background: var(--surface-2); }
  .ctx-menu .item .icon { width: 18px; text-align: center; }
  .ctx-menu .sep { height: 1px; background: var(--border); margin: 4px 0; }
  .ctx-menu .submenu { position: relative; }
  .ctx-menu .submenu .arrow { margin-left: auto; opacity: 0.6; }
  .ctx-menu .submenu-items {
    display: none; position: absolute; right: 100%; top: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px; min-width: 130px; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  .ctx-menu .submenu:hover .submenu-items { display: block; }

  /* When chat is open, the PDF area shrinks */
  body.chat-open .pdf-area { padding-right: 24px; }
  body.chat-open .hover-tab .tab-btn { border-radius: 8px 0 0 8px; }

  @media (max-width: 900px) {
    .chat-sidebar { width: 100vw; }
    .color-popover { right: -8px; }
  }
  @media (max-width: 720px) {
    .toolbar { padding: 6px 8px; gap: 6px; }
    .toolbar .file-name { display: none; }
    .pdf-area { padding: 10px; }
    .dock-row input[type="range"] { width: 60px; }
  }
</style>
</head>
<body>

<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-box" id="uploadBox">
    <div class="icon">📄</div>
    <h2>Upload a PDF</h2>
    <p>Drop your PDF here or click to browse</p>
    <input type="file" id="fileInput" accept=".pdf">
  </div>
</div>

<div class="toolbar" id="toolbar">
  <span class="brand">📖 Kokoro Reader</span>
  <span class="sep"></span>
  <span class="file-name" id="fileName">No file</span>
  <span class="sep"></span>

  <div class="group">
    <button id="prevPageBtn" class="icon-btn" title="Previous page (←)">◀</button>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = id => document.getElementById(id);
const THEMES = ['light', 'dark', 'sepia', 'black'];
const THEME_ICONS = { light: '☀️', dark: '🌙', sepia: '📜', black: '⬛' };

const state = {
  sessionId: null,
  pdfDoc: null,
  currentPage: 1,
  scale: 1.5,
  rotation: 0,
  theme: 'dark',
  highlightColor: '#facc15',
  highlightOpacity: 0.55,
  segments: [],
  currentSegIdx: 0,
  audioEl: null,
  preloads: [],
  isPlaying: false,
  isPaused: false,
  generating: false,
  pollTimer: null,
  stopPolling: false,
  pageRenderTask: null,
  textRenderTask: null,
  zoomLocked: false,
  chat: {
    open: false,
    chatId: null,
    messages: [],
    model: '',
    models: [],
    streaming: false,
    streamBuf: '',
    streamReasoning: '',
    focus: '',
    pdfMeta: null,
    pendingAction: null,
  },
};

const el = {
  uploadOverlay: $('uploadOverlay'), uploadBox: $('uploadBox'), fileInput: $('fileInput'),
  fileName: $('fileName'),
  pdfArea: $('pdfArea'), pageWrapper: $('pageWrapper'), pdfCanvas: $('pdfCanvas'),
  textLayer: $('textLayer'), highlightOverlay: $('highlightOverlay'),
  pageInput: $('pageInput'), pageTotal: $('pageTotal'),
  prevPageBtn: $('prevPageBtn'), nextPageBtn: $('nextPageBtn'),
  zoomOutBtn: $('zoomOutBtn'), zoomInBtn: $('zoomInBtn'), zoomSelect: $('zoomSelect'),
  rotateBtn: $('rotateBtn'), fullscreenBtn: $('fullscreenBtn'), themeBtn: $('themeBtn'),
  voiceSelect: $('voiceSelect'), speedSlider: $('speedSlider'), speedVal: $('speedVal'),
  speedLabel: $('speedLabel'), readAloudBtn: $('readAloudBtn'), configSep: $('configSep'),
  prevSegBtn: $('prevSegBtn'), playBtn: $('playBtn'), nextSegBtn: $('nextSegBtn'),
  stopBtn: $('stopBtn'),
  timeCurrent: $('timeCurrent'), timeTotal: $('timeTotal'),
  dockProgress: $('dockProgress'), dockProgressFill: $('dockProgressFill'),
  segInfo: $('segInfo'), pageStatus: $('pageStatus'),
  genIndicator: $('genIndicator'), genText: $('genText'), genFill: $('genFill'),
  colorBtn: $('colorBtn'), colorPopover: $('colorPopover'),
  colorSwatches: $('colorSwatches'), colorPicker: $('colorPicker'),
  opacitySlider: $('opacitySlider'), opacityVal: $('opacityVal'),
  hoverTab: $('hoverTab'), chatTabBtn: $('chatTabBtn'), chatTabIcon: $('chatTabIcon'), chatTabLabel: $('chatTabLabel'),
  chatSidebar: $('chatSidebar'),
  chatNewBtn: $('chatNewBtn'), chatCloseBtn: $('chatCloseBtn'),
  chatSessions: $('chatSessions'),
  chatModelSelect: $('chatModelSelect'),
  chatContextBadge: $('chatContextBadge'), chatTruncBadge: $('chatTruncBadge'),
  chatFocus: $('chatFocus'), chatFocusText: $('chatFocusText'), chatFocusClear: $('chatFocusClear'),
  chatMessages: $('chatMessages'),
  chatTyping: $('chatTyping'), chatTypingText: $('chatTypingText'),
  chatInput: $('chatInput'), chatSendBtn: $('chatSendBtn'),
  ctxMenu: $('ctxMenu'),
};

const ctx = el.pdfCanvas.getContext('2d');

// ─── Theme ───
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  el.themeBtn.textContent = THEME_ICONS[theme] || '🌓';
  state.theme = theme;
  try { localStorage.setItem('kokoro-theme', theme); } catch {}
}
function cycleTheme() {
  const idx = THEMES.indexOf(state.theme);
  applyTheme(THEMES[(idx + 1) % THEMES.length]);
}
(function initTheme() {
  let saved = 'dark';
  try { saved = localStorage.getItem('kokoro-theme') || 'dark'; } catch {}
  if (!THEMES.includes(saved)) saved = 'dark';
  applyTheme(saved);
})();
el.themeBtn.addEventListener('click', cycleTheme);

// ─── Highlight color picker ───
function hexToRgba(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}
function applyHighlightColor() {
  const c = state.highlightColor;
  const a = state.highlightOpacity;
  const aDone = Math.max(0.08, a * 0.35);
  document.documentElement.style.setProperty('--highlight', hexToRgba(c, a * 0.55));
  document.documentElement.style.setProperty('--highlight-active', hexToRgba(c, a));
  document.documentElement.style.setProperty('--highlight-done', hexToRgba(c, aDone));
  document.querySelectorAll('.swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.color && s.dataset.color.toLowerCase() === c.toLowerCase());
  });
  el.opacityVal.textContent = state.highlightOpacity.toFixed(2);
  el.opacitySlider.value = state.highlightOpacity;
  el.colorPicker.value = c;
  try {
    localStorage.setItem('kokoro-hl-color', c);
    localStorage.setItem('kokoro-hl-opacity', String(state.highlightOpacity));
  } catch {}
}
function setHighlightColor(c) { state.highlightColor = c; applyHighlightColor(); }
function setHighlightOpacity(o) { state.highlightOpacity = Math.max(0.1, Math.min(0.9, +o)); applyHighlightColor(); }
(function initHighlightColor() {
  try {
    const c = localStorage.getItem('kokoro-hl-color');
    const o = localStorage.getItem('kokoro-hl-opacity');
    if (c && /^#[0-9a-f]{6}$/i.test(c)) state.highlightColor = c;
    if (o) state.highlightOpacity = parseFloat(o) || 0.55;
  } catch {}
  applyHighlightColor();
})();
el.colorBtn.addEventListener('click', e => { e.stopPropagation(); el.colorPopover.classList.toggle('hidden'); });
document.addEventListener('click', e => {
  if (!el.colorPopover.classList.contains('hidden') && !el.colorPopover.contains(e.target) && e.target !== el.colorBtn) {
    el.colorPopover.classList.add('hidden');
  }
});
el.colorSwatches.addEventListener('click', e => {
  const sw = e.target.closest('.swatch');
  if (!sw) return;
  setHighlightColor(sw.dataset.color);
});
el.colorPicker.addEventListener('input', e => setHighlightColor(e.target.value));
el.opacitySlider.addEventListener('input', e => setHighlightOpacity(e.target.value));

// ─── Upload ───
el.uploadBox.addEventListener('click', () => el.fileInput.click());
el.uploadBox.addEventListener('dragover', e => { e.preventDefault(); el.uploadBox.classList.add('dragover'); });
el.uploadBox.addEventListener('dragleave', () => el.uploadBox.classList.remove('dragover'));
el.uploadBox.addEventListener('drop', e => {
  e.preventDefault(); el.uploadBox.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
el.fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

async function handleFile(file) {
  if (!file.name.endsWith('.pdf')) return alert('Please select a PDF file');
  const fd = new FormData(); fd.append('file', file);
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    state.sessionId = data.session_id;
    el.fileName.textContent = data.filename;
    el.uploadOverlay.classList.add('hidden');
    el.voiceSelect.style.display = ''; el.speedLabel.style.display = ''; el.configSep.style.display = ''; el.readAloudBtn.style.display = '';
    el.pageTotal.textContent = `/ ${data.total_pages}`;
    const pdfRes = await fetch(`/api/pdf/${state.sessionId}`);
    const pdfBlob = await pdfRes.blob();
    const pdfUrl = URL.createObjectURL(pdfBlob);
    state.pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
    state.currentPage = 1; el.pageInput.value = 1;
    await renderPage(); updateNav();
    el.pageStatus.textContent = `Page ${state.currentPage} / ${state.pdfDoc.numPages}`;
  } catch(e) { alert('Upload failed: ' + e.message); }
}

// ─── PDF rendering ───
async function renderPage() {
  if (!state.pdfDoc) return;
  if (state.pageRenderTask) { try { state.pageRenderTask.cancel(); } catch {} }
  if (state.textRenderTask) { try { state.textRenderTask.cancel(); } catch {} }
  const page = await state.pdfDoc.getPage(state.currentPage);
  const viewport = page.getViewport({ scale: state.scale, rotation: state.rotation });
  el.pdfCanvas.width = viewport.width;
  el.pdfCanvas.height = viewport.height;
  el.pdfCanvas.style.width = viewport.width + 'px';
  el.pdfCanvas.style.height = viewport.height + 'px';
  el.pageWrapper.style.width = viewport.width + 'px';
  el.pageWrapper.style.height = viewport.height + 'px';
  el.highlightOverlay.style.width = viewport.width + 'px';
  el.highlightOverlay.style.height = viewport.height + 'px';
  el.textLayer.style.width = viewport.width + 'px';
  el.textLayer.style.height = viewport.height + 'px';
  el.textLayer.style.setProperty('--scale-factor', viewport.scale);
  state.pageRenderTask = page.render({ canvasContext: ctx, viewport });
  try { await state.pageRenderTask.promise; } catch (e) { if (e.name !== 'RenderingCancelledException') throw e; }
  try {
    const textContent = await page.getTextContent();
    const textLayerDiv = el.textLayer;
    textLayerDiv.innerHTML = '';
    const renderTask = pdfjsLib.renderTextLayer({
      textContent,
      container: textLayerDiv,
      viewport,
      textDivs: [],
      enhanceTextSelection: true,
    });
    state.textRenderTask = renderTask;
    await renderTask.promise;
  } catch (e) { if (e.name !== 'RenderingCancelledException') console.warn('Text layer render error', e); }
  renderHighlights(page, viewport);
  updateNav();
  if (!state.zoomLocked) {
    el.zoomSelect.value = String(state.scale);
  }
  el.pageStatus.textContent = `Page ${state.currentPage} / ${state.pdfDoc.numPages}`;
  updateProgress();
}

function renderHighlights(page, viewport) {
  el.highlightOverlay.innerHTML = '';
  if (!state.segments.length) return;
  // PyMuPDF uses top-left origin (y-down), PDF.js uses bottom-left origin (y-up).
  // Get page height in PDF units so we can flip Y coordinates.
  const pdfPageH = page.getViewport({ scale: 1, rotation: 0 }).height;
  state.segments.forEach((seg, idx) => {
    if (!seg.rects) return;
    seg.rects.forEach(rect => {
      let r;
      try {
        // Flip Y: PyMuPDF (y=0 at top) → PDF.js (y=0 at bottom)
            r = viewport.convertToViewportRectangle([
                    rect[0], pdfPageH - rect[1],
                    rect[2], pdfPageH - rect[3]
                ]);
      } catch { return; }
      const [x0, y0, x1, y1] = r;
      const div = document.createElement('div');
      div.className = 'highlight-rect';
      div.dataset.idx = idx;
      div.style.left = Math.min(x0, x1) + 'px';
      div.style.top = Math.min(y0, y1) + 'px';
      div.style.width = Math.abs(x1 - x0) + 'px';
      div.style.height = Math.abs(y1 - y0) + 'px';
      el.highlightOverlay.appendChild(div);
    });
  });
  applyHighlightClasses();
}

function applyHighlightClasses() {
  document.querySelectorAll('.highlight-rect').forEach(d => {
    const i = +d.dataset.idx;
    d.classList.remove('active', 'done');
    if (i < state.currentSegIdx) d.classList.add('done');
    else if (i === state.currentSegIdx) d.classList.add('active');
  });
}

// ─── Navigation ───
function updateNav() {
  if (!state.pdfDoc) return;
  el.prevPageBtn.disabled = state.currentPage <= 1;
  el.nextPageBtn.disabled = state.currentPage >= state.pdfDoc.numPages;
  el.pageInput.max = state.pdfDoc.numPages;
}
el.prevPageBtn.addEventListener('click', () => { if (state.currentPage > 1) { state.currentPage--; el.pageInput.value = state.currentPage; renderPage(); }});
el.nextPageBtn.addEventListener('click', () => { if (state.pdfDoc && state.currentPage < state.pdfDoc.numPages) { state.currentPage++; el.pageInput.value = state.currentPage; renderPage(); }});
el.pageInput.addEventListener('change', () => {
  const v = parseInt(el.pageInput.value, 10);
  if (!state.pdfDoc || isNaN(v)) return;
  const clamped = Math.max(1, Math.min(state.pdfDoc.numPages, v));
  el.pageInput.value = clamped;
  state.currentPage = clamped;
  renderPage();
});

// ─── Zoom ───
function setZoom(newScale, fromSelect = false) {
  state.scale = Math.max(0.25, Math.min(8, newScale));
  state.zoomLocked = false;
  const matchOpt = Array.from(el.zoomSelect.options).find(o => parseFloat(o.value) === state.scale);
  if (matchOpt) el.zoomSelect.value = matchOpt.value;
  else if (!fromSelect) el.zoomSelect.value = String(state.scale);
  renderPage();
}
el.zoomInBtn.addEventListener('click', () => setZoom(state.scale + 0.25));
el.zoomOutBtn.addEventListener('click', () => setZoom(state.scale - 0.25));
el.zoomSelect.addEventListener('change', async () => {
  const v = el.zoomSelect.value;
  if (v === 'fit-width' || v === 'fit-page') {
    if (!state.pdfDoc) return;
    const page = await state.pdfDoc.getPage(state.currentPage);
    const baseVp = page.getViewport({ scale: 1, rotation: state.rotation });
    const availW = el.pdfArea.clientWidth - 48;
    const availH = el.pdfArea.clientHeight - 48;
    const fitW = availW / baseVp.width;
    const fitH = availH / baseVp.height;
    setZoom(v === 'fit-width' ? fitW : Math.min(fitW, fitH));
    state.zoomLocked = true;
  } else if (v === 'actual') {
    setZoom(1.0);
  } else {
    setZoom(parseFloat(v), true);
  }
});

// Ctrl + wheel zoom
el.pdfArea.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    if (e.deltaY < 0) setZoom(state.scale + 0.1);
    else setZoom(state.scale - 0.1);
  }
}, { passive: false });

// ─── Rotate / Fullscreen ───
el.rotateBtn.addEventListener('click', () => {
  state.rotation = (state.rotation + 90) % 360;
  renderPage();
});
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}
el.fullscreenBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
});

// ─── TTS configuration ───
el.speedSlider.addEventListener('input', () => {
  el.speedVal.textContent = parseFloat(el.speedSlider.value).toFixed(1);
  if (state.audioEl) state.audioEl.playbackRate = parseFloat(el.speedSlider.value);
});

// ─── Read Aloud ───
el.readAloudBtn.addEventListener('click', async () => {
  if (!state.sessionId || !state.pdfDoc || state.generating) return;
  resetReader();
  startGeneration(state.currentPage - 1);
});

async function startGeneration(pageNum) {
  state.generating = true;
  el.genIndicator.classList.remove('hidden');
  el.genText.textContent = 'Starting…';
  el.genFill.style.width = '0%';
  el.playBtn.disabled = true;
  el.prevSegBtn.disabled = true; el.nextSegBtn.disabled = true;
  try {
    const res = await fetch('/api/generate-page', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: state.sessionId, page_num: pageNum,
        voice: el.voiceSelect.value, speed: parseFloat(el.speedSlider.value)
      })
    });
    const data = await res.json();
    if (data.error) { finishGen(); alert(data.error); return; }
    if (data.status === 'ready') { onPageReady(data.segments); return; }
    pollGeneration(pageNum);
  } catch (e) { finishGen(); alert('Generation request failed: ' + e.message); }
}

function finishGen() {
  state.generating = false;
  el.genIndicator.classList.add('hidden');
}

async function pollGeneration(pageNum) {
  state.stopPolling = false;
  const poll = async () => {
    if (state.stopPolling) return;
    try {
      const res = await fetch(`/api/page-status/${state.sessionId}/${pageNum}`);
      const data = await res.json();
      if (data.status === 'ready') {
        const r2 = await fetch(`/api/page-data/${state.sessionId}/${pageNum}`);
        const pageData = await r2.json();
        onPageReady(pageData.segments);
        prefetchNextPages();
        return;
      }
      if (data.status === 'generating') {
        const pct = data.total > 0 ? (data.progress / data.total) * 100 : 0;
        el.genFill.style.width = pct + '%';
        el.genText.textContent = `Generating audio… ${data.progress}/${data.total} paragraphs`;
      }
      state.pollTimer = setTimeout(poll, 1500);
    } catch { state.pollTimer = setTimeout(poll, 3000); }
  };
  poll();
}

async function prefetchNextPages() {
  try {
    await fetch('/api/generate-next-pages', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: state.sessionId, current_page: state.currentPage - 1,
        voice: el.voiceSelect.value, speed: parseFloat(el.speedSlider.value), n_ahead: 3
      })
    });
  } catch {}
}

function onPageReady(segments) {
  state.segments = segments;
  state.currentSegIdx = 0;
  finishGen();
  updatePlayBtns();
  el.segInfo.textContent = `0 / ${segments.length}`;
  preloadPage(0);
  renderPage().then(() => playSegment(0));
}

function preloadPage(fromIdx) {
  if (state.preloads) {
    state.preloads.forEach(a => { a.src = ''; });
  }
  state.preloads = [];
  for (let i = fromIdx; i < state.segments.length; i++) {
    const seg = state.segments[i];
    if (!seg) break;
    const a = new Audio(seg.audio_url + '?t=' + Date.now());
    a.preload = 'auto';
    a.dataset.segIdx = i;
    a.load();
    state.preloads.push(a);
  }
}

function playSegment(idx) {
  if (idx >= state.segments.length) { advanceToNextPage(); return; }
  if (idx < 0) idx = 0;
  const seg = state.segments[idx];
  if (!seg) return;
  if (state.audioEl) { state.audioEl.pause(); state.audioEl = null; }
  const preloaded = (state.preloads || []).find(a => +a.dataset.segIdx === idx);
  if (preloaded) {
    state.audioEl = preloaded;
  } else {
    state.audioEl = new Audio(seg.audio_url + '?t=' + Date.now());
  }
  state.audioEl.playbackRate = parseFloat(el.speedSlider.value);
  state.audioEl.play().catch(() => {});
  state.isPlaying = true; state.isPaused = false; state.currentSegIdx = idx;
  updatePlayBtns();
  applyHighlightClasses();
  updateProgress();
  const segStartTime = state.segments.slice(0, idx).reduce((s, x) => s + (x.duration || 0), 0);
  state.audioEl.addEventListener('timeupdate', () => {
    const elapsed = segStartTime + (state.audioEl.currentTime || 0);
    const total = state.segments.reduce((s, x) => s + (x.duration || 0), 0);
    if (total > 0) el.dockProgressFill.style.width = (elapsed / total * 100) + '%';
    el.timeCurrent.textContent = fmt(elapsed);
  }, { once: false });
  state.audioEl.addEventListener('ended', () => playSegment(idx + 1));
  state.audioEl.addEventListener('error', () => playSegment(idx + 1));
}

function updateProgress() {
  if (!state.segments.length) {
    el.dockProgressFill.style.width = '0%';
    el.timeCurrent.textContent = '0:00';
    el.timeTotal.textContent = '0:00';
    el.segInfo.textContent = '0 / 0';
    return;
  }
  let elapsed = 0, total = 0;
  state.segments.forEach((s, i) => {
    if (i < state.currentSegIdx) elapsed += s.duration || 0;
    total += s.duration || 0;
  });
  if (state.audioEl && !state.isPaused) elapsed += state.audioEl.currentTime || 0;
  el.timeTotal.textContent = fmt(total);
  el.timeCurrent.textContent = fmt(elapsed);
  el.segInfo.textContent = `${state.currentSegIdx} / ${state.segments.length}`;
  el.dockProgressFill.style.width = total > 0 ? (elapsed / total * 100) + '%' : '0%';
}

function updatePlayBtns() {
  const has = state.segments.length > 0;
  el.playBtn.disabled = !has;
  el.playBtn.textContent = state.isPlaying && !state.isPaused ? '⏸' : '▶';
  el.prevSegBtn.disabled = !has || state.currentSegIdx <= 0;
  el.nextSegBtn.disabled = !has || state.currentSegIdx >= state.segments.length - 1;
}

el.playBtn.addEventListener('click', () => {
  if (state.isPlaying && !state.isPaused && state.audioEl) {
    state.audioEl.pause();
    state.isPaused = true;
    updatePlayBtns();
    return;
  }
  if (state.isPaused && state.audioEl) {
    state.audioEl.play();
    state.isPlaying = true;
    state.isPaused = false;
    updatePlayBtns();
    return;
  }
  if (state.segments.length) playSegment(state.currentSegIdx);
});
el.prevSegBtn.addEventListener('click', () => { if (state.segments.length && state.currentSegIdx > 0) playSegment(state.currentSegIdx - 1); });
el.nextSegBtn.addEventListener('click', () => { if (state.segments.length && state.currentSegIdx < state.segments.length - 1) playSegment(state.currentSegIdx + 1); });
el.stopBtn.addEventListener('click', () => stopReading());

function stopReading() {
  state.stopPolling = true; state.generating = false;
  if (state.audioEl) { state.audioEl.pause(); state.audioEl = null; }
  if (state.preloads) { state.preloads.forEach(a => { a.src = ''; }); state.preloads = []; }
  state.isPlaying = false; state.isPaused = false; state.currentSegIdx = 0;
  updatePlayBtns();
  el.dockProgressFill.style.width = '0%';
  el.timeCurrent.textContent = '0:00';
  el.segInfo.textContent = state.segments.length ? `0 / ${state.segments.length}` : '0 / 0';
  applyHighlightClasses();
}

function resetReader() {
  if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
  state.stopPolling = true; state.generating = false;
  if (state.audioEl) { state.audioEl.pause(); state.audioEl = null; }
  if (state.preloads) { state.preloads.forEach(a => { a.src = ''; }); state.preloads = []; }
  state.isPlaying = false; state.isPaused = false; state.currentSegIdx = 0; state.segments = [];
  el.genIndicator.classList.add('hidden');
  el.dockProgressFill.style.width = '0%';
  el.timeCurrent.textContent = '0:00';
  el.timeTotal.textContent = '0:00';
  el.segInfo.textContent = '0 / 0';
  updatePlayBtns();
  el.highlightOverlay.innerHTML = '';
}

async function advanceToNextPage() {
  if (!state.pdfDoc || state.currentPage >= state.pdfDoc.numPages) { stopReading(); return; }
  state.currentPage++; el.pageInput.value = state.currentPage;
  await renderPage();
  startGeneration(state.currentPage - 1);
}

// Click-to-seek on the dock progress bar
el.dockProgress.addEventListener('click', e => {
  if (!state.segments.length) return;
  const rect = el.dockProgress.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  const total = state.segments.reduce((s, x) => s + (x.duration || 0), 0);
  const targetTime = ratio * total;
  let acc = 0, idx = 0;
  for (let i = 0; i < state.segments.length; i++) {
    const d = state.segments[i].duration || 0;
    if (acc + d > targetTime) { idx = i; break; }
    acc += d; idx = i + 1;
  }
  if (idx >= state.segments.length) idx = state.segments.length - 1;
  playSegment(idx);
  if (state.audioEl) state.audioEl.currentTime = Math.max(0, targetTime - acc);
});

function fmt(secs) {
  const m = Math.floor(secs / 60), s = Math.floor(secs % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ─── Keyboard shortcuts ───
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (state.chat.open) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); el.prevPageBtn.click(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); el.nextPageBtn.click(); }
  else if (e.key === ' ') { e.preventDefault(); el.playBtn.click(); }
  else if (e.key === 'n' || e.key === 'N') { el.nextSegBtn.click(); }
  else if (e.key === 'p' || e.key === 'P') { el.prevSegBtn.click(); }
  else if (e.key === 'r' || e.key === 'R') { el.rotateBtn.click(); }
  else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
  else if (e.key === 't' || e.key === 'T') { cycleTheme(); }
  else if (e.key === 'Escape' && document.fullscreenElement) { document.exitFullscreen?.(); }
});

  { id: 'summarize', icon: '📝', label: 'Summarize',          action: 'Summarize this passage in 3-5 bullet points.' },
  { id: 'define', icon: '🔤', label: 'Define key terms',     action: 'Define the key terms in this passage.' },
  { id: 'simplify', icon: '🧒', label: 'Simplify (ELI5)',    action: 'Explain this passage like I am 5 years old.' },
  { id: 'critique', icon: '🧠', label: 'Critique',           action: 'Critique the argument or claims in this passage.' },
  { id: 'questions', icon: '❓', label: 'Generate questions', action: 'Generate 5 study questions from this passage.' },
  { id: 'keyterms', icon: '🔑', label: 'List key terms',    action: 'List the key terms introduced in this passage.' },
  { id: 'related', icon: '🔗', label: 'Find related passages', action: 'Find other passages in the PDF related to this one and quote them briefly.' },
  { id: 'code', icon: '🧑‍💻', label: 'Extract code/formulas', action: 'Extract any code snippets or formulas from this passage.' },

    { id: 'tr-en', label: 'English', action: 'Translate this passage to English.' },
    { id: 'tr-fa', label: 'فارسی (Persian)', action: 'Translate this passage to Persian (Farsi).' },
    { id: 'tr-fr', label: 'Français', action: 'Translate this passage to French.' },
    { id: 'tr-de', label: 'Deutsch', action: 'Translate this passage to German.' },
    { id: 'tr-zh', label: '中文', action: 'Translate this passage to Chinese (Simplified).' },
  ]},
];

function buildCtxMenu() {
  el.ctxMenu.innerHTML = '';
  CTX_ACTIONS.forEach(item => {
    if (item.submenu) {
      const wrap = document.createElement('div');
      wrap.className = 'item submenu';
      wrap.innerHTML = `<span class="icon">${item.icon}</span><span>${item.label}</span><span class="arrow">▸</span>`;
      const sub = document.createElement('div');
      sub.className = 'submenu-items';
      item.submenu.forEach(s => {
        const subItem = document.createElement('div');
        subItem.className = 'item';
        subItem.textContent = s.label;
        subItem.addEventListener('click', e => {
          e.stopPropagation();
          hideCtxMenu();
          runCtxAction(s.action);
        });
        sub.appendChild(subItem);
      });
      wrap.appendChild(sub);
      el.ctxMenu.appendChild(wrap);
    } else {
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = `<span class="icon">${item.icon}</span><span>${item.label}</span>`;
      d.addEventListener('click', e => {
        e.stopPropagation();
        hideCtxMenu();
        if (item.id === 'chat') openChatWithFocus(prefillFromSelection());
        else runCtxAction(item.action);
      });
      el.ctxMenu.appendChild(d);
    }
  });
}
function showCtxMenu(x, y) {
  buildCtxMenu();
  el.ctxMenu.classList.remove('hidden');
  el.ctxMenu.style.left = '0px'; el.ctxMenu.style.top = '0px';
  const rect = el.ctxMenu.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width - 8;
  const maxY = window.innerHeight - rect.height - 8;
  el.ctxMenu.style.left = Math.min(x, maxX) + 'px';
  el.ctxMenu.style.top = Math.min(y, maxY) + 'px';
}
function hideCtxMenu() { el.ctxMenu.classList.add('hidden'); }
function getSelectionText() {
  const s = window.getSelection();
  return s ? s.toString().trim() : '';
}
function prefillFromSelection() {
  const t = getSelectionText();
  if (!t) return;
  state.chat.focus = t;
  renderFocus();
  openChat();
  if (t.length > 1500) state.chat.focus = t.slice(0, 1500);
  return t;
}
function runCtxAction(action) {
  if (!state.sessionId) return alert('Upload a PDF first');
  const focus = getSelectionText() || state.chat.focus;
  if (!focus) return;
  state.chat.focus = focus.length > 4000 ? focus.slice(0, 4000) : focus;
  renderFocus();
  openChat();
  ensureChat().then(() => sendChatMessage(action || 'Discuss this passage.', true));
}

document.addEventListener('contextmenu', e => {
  const t = getSelectionText();
  if (t && t.length > 0) {
    e.preventDefault();
    showCtxMenu(e.clientX, e.clientY);
  }
});
document.addEventListener('click', e => {
  if (!el.ctxMenu.classList.contains('hidden') && !el.ctxMenu.contains(e.target)) hideCtxMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtxMenu(); });

// ─── Chat sidebar ───
function openChat() {
  state.chat.open = true;
  el.chatSidebar.classList.add('open');
  el.hoverTab.classList.add('open');
  el.chatTabIcon.textContent = '✕';
  document.body.classList.add('chat-open');
  if (state.sessionId) {
    loadChatModels();
    loadChatSessions();
    ensureChat();
  }
}
function closeChat() {
  state.chat.open = false;
  el.chatSidebar.classList.remove('open');
  el.hoverTab.classList.remove('open');
  el.chatTabIcon.textContent = '💬';
  document.body.classList.remove('chat-open');
}
function toggleChat() { state.chat.open ? closeChat() : openChat(); }
el.chatTabBtn.addEventListener('click', toggleChat);
el.chatCloseBtn.addEventListener('click', closeChat);
el.hoverTab.addEventListener('mouseenter', () => { if (!state.chat.open) el.chatTabLabel.style.opacity = '1'; });
el.hoverTab.addEventListener('mouseleave', () => { if (!state.chat.open) el.chatTabLabel.style.opacity = ''; });

function renderFocus() {
  const f = state.chat.focus;
  if (f && f.trim()) {
    el.chatFocusText.textContent = f;
    el.chatFocus.classList.remove('hidden');
  } else {
    el.chatFocus.classList.add('hidden');
  }
}
el.chatFocusClear.addEventListener('click', () => { state.chat.focus = ''; renderFocus(); });

async function loadChatModels() {
  if (state.chat.models.length) {
    populateModelSelect();
    return;
  }
  try {
    const r = await fetch('/api/chat/models');
    const data = await r.json();
    state.chat.models = data.models || [];
    populateModelSelect();
  } catch (e) {
    el.chatModelSelect.innerHTML = '<option value="opencode/big-pickle">big-pickle (default)</option>';
  }
}
function populateModelSelect() {
  const sel = el.chatModelSelect;
  const cur = state.chat.model || sel.value;
  sel.innerHTML = '';
  state.chat.models.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id; opt.textContent = m.name;
    opt.title = m.id;
    sel.appendChild(opt);
  });
  if (cur && state.chat.models.find(m => m.id === cur)) sel.value = cur;
  else if (!sel.value && state.chat.models.length) sel.value = state.chat.models[0].id;
  state.chat.model = sel.value;
}
el.chatModelSelect.addEventListener('change', async () => {
  state.chat.model = el.chatModelSelect.value;
  if (state.chat.chatId) {
    try { await fetch(`/api/chat/session/${state.chat.chatId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: state.chat.model }) }); } catch {}
  }
});

async function loadChatSessions() {
  if (!state.sessionId) return;
  try {
    const r = await fetch(`/api/chat/sessions/${state.sessionId}`);
    const data = await r.json();
    renderSessionChips(data.chats || []);
  } catch (e) { console.warn('loadChatSessions', e); }
}
function renderSessionChips(chats) {
  el.chatSessions.innerHTML = '';
  chats.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chat-chip' + (c.id === state.chat.chatId ? ' active' : '');
    chip.title = c.title;
    chip.textContent = c.title;
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '✕';
    x.addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm('Delete this chat?')) return;
      try { await fetch(`/api/chat/session/${c.id}`, { method: 'DELETE' }); } catch {}
      if (state.chat.chatId === c.id) state.chat.chatId = null;
      loadChatSessions();
    });
    chip.appendChild(x);
    chip.addEventListener('click', () => openChatById(c.id));
    el.chatSessions.appendChild(chip);
  });
}

el.chatNewBtn.addEventListener('click', () => {
  state.chat.chatId = null;
  state.chat.messages = [];
  state.chat.focus = '';
  renderFocus();
  renderMessages();
  ensureChat();
});

async function ensureChat() {
  if (!state.sessionId) return;
  if (state.chat.chatId) {
    await openChatById(state.chat.chatId);
    return;
  }
  try {
    const r = await fetch('/api/chat/sessions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pdf_session_id: state.sessionId, model: state.chat.model || 'opencode/big-pickle' }),
    });
    const data = await r.json();
    state.chat.chatId = data.chat.id;
    state.chat.model = data.chat.model;
    populateModelSelect();
    loadChatSessions();
    await loadPdfMeta();
  } catch (e) { console.warn('ensureChat', e); }
}
async function openChatById(chatId) {
  try {
    const r = await fetch(`/api/chat/session/${chatId}`);
    if (!r.ok) return;
    const data = await r.json();
    state.chat.chatId = chatId;
    state.chat.messages = (data.chat.messages || []).map(stripMsgArtifacts);
    state.chat.model = data.chat.model || state.chat.model;
    populateModelSelect();
    renderMessages();
    loadChatSessions();
    loadPdfMeta();
  } catch (e) { console.warn('openChatById', e); }
}
async function loadPdfMeta() {
  if (!state.sessionId || state.chat.pdfMeta) return;
  try {
    const r = await fetch(`/api/chat/pdf-text/${state.sessionId}`);
    if (!r.ok) return;
    const m = await r.json();
    state.chat.pdfMeta = m;
    el.chatContextBadge.textContent = `PDF: ${m.pages} pages, ${Math.round(m.chars/1000)}k chars`;
    el.chatContextBadge.classList.remove('hidden');
    el.chatTruncBadge.classList.toggle('hidden', !m.truncated);
  } catch {}
}

function stripMsgArtifacts(m) {
  if (m && typeof m.content === 'string') m.content = stripArtifacts(m.content);
  if (m && typeof m.reasoning === 'string') m.reasoning = stripArtifacts(m.reasoning);
  return m;
}
function stripArtifacts(text) {
  if (!text) return '';
  return text
    .replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '')
    .replace(/[\u2500-\u257F\u2580-\u259F\u2800-\u28FF]/g, '')
    .replace(/[█▀▁▂▃▄▅▆▇▉▊▋▌▍▎▏▔▕▖▗▘▙▚▛▜▝▞▟]/g, '')
    .replace(/[⠁-⣿]/g, '')
    .replace(/[\u2300-\u23FF]/g, '')
    .replace(/[▓▒░]/g, '')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function renderMessages() {
  const c = el.chatMessages;
  c.innerHTML = '';
  if (!state.chat.messages.length && !state.chat.streaming) {
    c.innerHTML = '<div style="color:var(--muted);text-align:center;padding:24px 12px;font-size:0.85rem">No messages yet. Ask about the PDF or right-click selected text to use a quick action.</div>';
    return;
  }
  state.chat.messages.forEach((m, idx) => c.appendChild(buildMessageNode(m, idx)));
  if (state.chat.streaming && state.chat.streamBuf !== undefined) {
    const live = buildStreamingNode();
    c.appendChild(live);
  }
  scrollChatToBottom();
}
function buildMessageNode(m, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'chat-msg ' + (m.role === 'user' ? 'user' : 'assistant');
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = m.role === 'user' ? 'You' : 'AI';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  if (m.action) {
    const t = document.createElement('span');
    t.className = 'action-tag';
    t.textContent = m.action;
    bub.appendChild(t);
  }
  if (m.role === 'user' && m.focus) {
    const fg = document.createElement('div');
    fg.className = 'focus-tag';
    fg.textContent = `📍 Focus: "${m.focus.length > 120 ? m.focus.slice(0, 120) + '…' : m.focus}"`;
    bub.appendChild(fg);
  }
  if (m.reasoning) {
    const det = document.createElement('details');
    det.className = 'reasoning';
    const sm = document.createElement('summary');
    sm.textContent = '💭 Show thinking';
    det.appendChild(sm);
    const rdiv = document.createElement('div');
    rdiv.textContent = m.reasoning;
    det.appendChild(rdiv);
    bub.appendChild(det);
  }
  const content = document.createElement('div');
  content.innerHTML = renderMarkdown(m.content || '');
  copyCodeButtons(content);
  bub.appendChild(content);
  if (m.role === 'assistant') wrap.appendChild(av);
  wrap.appendChild(bub);
  if (m.role === 'user') wrap.appendChild(av);
  return wrap;
}
function buildStreamingNode() {
  const wrap = document.createElement('div');
  wrap.className = 'chat-msg assistant';
  const av = document.createElement('div');
  av.className = 'avatar'; av.textContent = 'AI';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  if (state.chat.streamReasoning) {
    const det = document.createElement('details');
    det.className = 'reasoning'; det.open = true;
    const sm = document.createElement('summary');
    sm.textContent = '💭 Thinking…';
    det.appendChild(sm);
    const rdiv = document.createElement('div');
    rdiv.textContent = state.chat.streamReasoning;
    det.appendChild(rdiv);
    bub.appendChild(det);
  }
  const content = document.createElement('div');
  content.innerHTML = renderMarkdown(state.chat.streamBuf || '');
  copyCodeButtons(content);
  bub.appendChild(content);
  wrap.appendChild(av);
  wrap.appendChild(bub);
  return wrap;
}
function renderMarkdown(text) {
  if (!text) return '';
  try {
    if (window.marked) {
      window.marked.setOptions({ breaks: true, gfm: true });
      const raw = window.marked.parse(text);
      return window.DOMPurify ? window.DOMPurify.sanitize(raw) : raw;
    }
  } catch {}
  return text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])).replace(/\n/g, '<br>');
}
function copyCodeButtons(container) {
  container.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy-pre')) return;
    const btn = document.createElement('button');
    btn.className = 'copy-pre';
    btn.textContent = 'Copy';
    btn.addEventListener('click', () => {
      const code = pre.querySelector('code');
      navigator.clipboard.writeText(code ? code.innerText : pre.innerText);
      btn.textContent = 'Copied';
      setTimeout(() => btn.textContent = 'Copy', 1200);
    });
    pre.style.position = 'relative';
    pre.appendChild(btn);
  });
}
function scrollChatToBottom(force) {
  const c = el.chatMessages;
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 80;
  if (force || atBottom) c.scrollTop = c.scrollHeight;
}

// ─── Send message (SSE) ───
el.chatSendBtn.addEventListener('click', () => doSend());
el.chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); doSend(); }
});
el.chatInput.addEventListener('input', () => {
  el.chatInput.style.height = 'auto';
  el.chatInput.style.height = Math.min(120, el.chatInput.scrollHeight) + 'px';
});
async function doSend(prefilled) {
  const text = prefilled || el.chatInput.value;
  if (!text || !text.trim()) return;
  if (!state.sessionId) return alert('Upload a PDF first');
  el.chatInput.value = '';
  el.chatInput.style.height = 'auto';
  await ensureChat();
  await sendChatMessage(text.trim(), false);
}
async function sendChatMessage(text, isAction) {
  if (state.chat.streaming) return;
  state.chat.streaming = true;
  state.chat.streamBuf = '';
  state.chat.streamReasoning = '';
  const userMsg = {
    id: 'tmp_' + Date.now(),
    role: 'user',
    content: text,
    focus: state.chat.focus || null,
    action: isAction ? (state.chat.pendingAction || 'Chat about this') : null,
    timestamp: Date.now() / 1000,
  };
  state.chat.messages.push(userMsg);
  renderMessages();
  el.chatTyping.classList.remove('hidden');
  el.chatTypingText.textContent = state.chat.streamReasoning ? 'Thinking…' : 'Starting…';
  el.chatSendBtn.disabled = true;
  let lastUserRender = Date.now();
  let raf = null;
  const tickRender = () => {
    if (!state.chat.streaming) return;
    const now = Date.now();
    if (now - lastUserRender > 80) {
      renderMessages();
      lastUserRender = now;
    }
    raf = requestAnimationFrame(tickRender);
  };
  raf = requestAnimationFrame(tickRender);

  try {
    const r = await fetch('/api/chat/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: state.chat.chatId,
        message: text,
        focus: state.chat.focus || '',
        action: isAction ? (state.chat.pendingAction || '') : '',
      }),
    });
    if (!r.ok || !r.body) throw new Error('send failed: ' + r.status);
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const events = buf.split('\n\n');
      buf = events.pop() || '';
      for (const ev of events) {
        const lines = ev.split('\n');
        let evtName = 'message', data = '';
        for (const ln of lines) {
          if (ln.startsWith('event: ')) evtName = ln.slice(7).trim();
          else if (ln.startsWith('data: ')) data += ln.slice(6);
        }
        if (!data) continue;
        let payload;
        try { payload = JSON.parse(data); } catch { continue; }
        if (evtName === 'meta') { /* noop */ }
        else if (evtName === 'text') {
          state.chat.streamBuf += payload.chunk || '';
          el.chatTypingText.textContent = 'Writing…';
        }
        else if (evtName === 'reasoning') {
          state.chat.streamReasoning += payload.chunk || '';
        }
        else if (evtName === 'assistant') {
          if (payload.message) state.chat.messages.push(stripMsgArtifacts(payload.message));
        }
        else if (evtName === 'error') {
          state.chat.streamBuf += '\n\n⚠️ ' + (payload.error || 'error');
        }
      }
    }
  } catch (e) {
    state.chat.streamBuf += '\n\n⚠️ ' + (e.message || String(e));
  } finally {
    cancelAnimationFrame(raf);
    state.chat.streaming = false;
    el.chatTyping.classList.add('hidden');
    el.chatSendBtn.disabled = false;
    if (state.chat.streamBuf) {
      const finalMsg = {
        id: 'tmp_a_' + Date.now(),
        role: 'assistant',
        content: stripArtifacts(state.chat.streamBuf),
        reasoning: stripArtifacts(state.chat.streamReasoning) || null,
        timestamp: Date.now() / 1000,
      };
      const last = state.chat.messages[state.chat.messages.length - 1];
      if (!last || last.role !== 'assistant' || last.content !== finalMsg.content) {
        state.chat.messages.push(finalMsg);
      }
    }
    state.chat.streamBuf = '';
    state.chat.streamReasoning = '';
    state.chat.focus = '';
    renderFocus();
    renderMessages();
    loadChatSessions();
  }
}

// Clear action label after first use
const _origRun = runCtxAction;

// Hook action label so user sees what was triggered
const _origSend = sendChatMessage;

// ─── Extend keyboard shortcuts to handle chat ───
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
    e.preventDefault(); toggleChat(); return;
  }
  if (e.key === 'Escape' && state.chat.open) { closeChat(); return; }
});

// Refresh model list when chat opens
el.chatModelSelect.addEventListener('focus', () => loadChatModels());
</script>
