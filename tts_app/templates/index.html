<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokoro TTS PDF Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root { --bg: #0f0f1a; --surface: #1a1a2e; --border: #2a2a4a; --text: #e0e0e0; --muted: #888; --accent: #7c3aed; --accent-light: #a78bfa; --success: #4ade80; --danger: #dc2626; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  
  .hidden { display: none !important; }

  /* Toolbar */
  .toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar .brand { font-weight: 700; color: var(--accent-light); font-size: 1.1rem; white-space: nowrap; }
  .toolbar .sep { width: 1px; height: 28px; background: var(--border); }
  .toolbar .file-name { color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .toolbar button, .toolbar select { background: #252545; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; }
  .toolbar button:hover { background: #30305a; }
  .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar select { padding: 5px 8px; }
  .toolbar label { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }

  .btn-primary { background: var(--accent) !important; color: white !important; }
  .btn-primary:hover { background: #6d28d9 !important; }
  .btn-success { background: #059669 !important; color: white !important; }
  .btn-success:hover { background: #047857 !important; }
  .btn-danger { background: var(--danger) !important; color: white !important; }

  /* Main layout */
  .main { display: flex; height: calc(100vh - 53px); }
  .pdf-viewer { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 20px; position: relative; transition: background 0.3s; }
  .pdf-viewer.dark { background: #0a0a12; }
  .pdf-viewer:not(.dark) { background: #525252; }
  .pdf-viewer canvas { box-shadow: 0 2px 20px rgba(0,0,0,0.3); border-radius: 2px; }

  /* Audio reader panel */
  .reader-panel { width: 0; overflow: hidden; background: var(--surface); border-left: 1px solid var(--border); transition: width 0.3s ease; display: flex; flex-direction: column; }
  .reader-panel.open { width: 420px; min-width: 320px; }
  .reader-panel .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .reader-panel .panel-header h3 { font-size: 0.95rem; color: var(--accent-light); }
  .reader-panel .panel-header span { font-size: 0.8rem; color: var(--muted); }
  .reader-panel .panel-controls { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .reader-panel .panel-controls button { background: #252545; border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; color: var(--text); cursor: pointer; font-size: 0.85rem; }
  .reader-panel .panel-controls button:hover { background: #30305a; }
  .reader-panel .panel-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  
  .reader-panel .progress-row { padding: 8px 16px; border-bottom: 1px solid var(--border); }
  .reader-panel .progress-row .progress-bar { height: 4px; background: #2a2a4a; border-radius: 2px; overflow: hidden; }
  .reader-panel .progress-row .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); width: 0%; transition: width 0.3s; }
  .reader-panel .progress-row .progress-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  .reader-panel .paragraphs { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .reader-panel .paragraphs .para { padding: 10px 14px; margin: 4px 0; border-radius: 8px; font-size: 0.92rem; line-height: 1.7; color: #999; transition: all 0.2s; border-left: 3px solid transparent; }
  .reader-panel .paragraphs .para.active { color: var(--text); background: #7c3aed22; border-left-color: var(--accent-light); }
  .reader-panel .paragraphs .para.done { color: #555; }
  .reader-panel .paragraphs .para .page-label { font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 2px; }

  /* Upload overlay */
  .upload-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .upload-overlay.hidden { display: none; }
  .upload-box { background: var(--surface); border: 2px dashed var(--border); border-radius: 16px; padding: 60px 40px; text-align: center; max-width: 500px; width: 90%; cursor: pointer; transition: all 0.3s; }
  .upload-box:hover, .upload-box.dragover { border-color: var(--accent-light); background: #1e1e3a; }
  .upload-box .icon { font-size: 56px; margin-bottom: 16px; }
  .upload-box h2 { margin-bottom: 8px; color: var(--accent-light); }
  .upload-box p { color: var(--muted); font-size: 0.9rem; }
  .upload-box input { display: none; }

  /* Loading spinner */
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent-light); border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .generating-indicator { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.8rem; }

  @media (max-width: 768px) {
    .reader-panel.open { width: 100% !important; position: fixed; inset: 0; z-index: 500; }
    .pdf-viewer { display: none; }
    .reader-panel.open ~ .pdf-viewer { display: none; }
    .toolbar { font-size: 0.8rem; gap: 6px; }
    .toolbar .brand { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<!-- Upload Overlay -->
<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-box" id="uploadBox">
    <div class="icon">📄</div>
    <h2>Upload a PDF</h2>
    <p>Drop your PDF here or click to browse</p>
    <p style="font-size:0.8rem;margin-top:8px;color:#666">The PDF will be read aloud paragraph by paragraph</p>
    <input type="file" id="fileInput" accept=".pdf">
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar" id="toolbar">
  <span class="brand">Kokoro Reader</span>
  <span class="sep"></span>
  <span class="file-name" id="fileName">No file</span>
  <span class="sep"></span>
  <button id="prevPageBtn" title="Previous page">◀</button>
  <label><span id="pageInfo">- / -</span></label>
  <button id="nextPageBtn" title="Next page">▶</button>
  <span class="sep"></span>
  <button id="zoomOutBtn" title="Zoom out">🔍−</button>
  <label> <span id="zoomLabel">100</span>% </label>
  <button id="zoomInBtn" title="Zoom in">🔍+</button>
  <button id="fitPageBtn" title="Fit to width">⊞</button>
  <span class="sep"></span>
  <button id="darkToggle" title="Toggle dark mode">🌙</button>
  <span class="sep" id="configSep"></span>
  <select id="voiceSelect" style="display:none">
    <option value="af_heart">af_heart (warm)</option>
    <option value="af_bella">af_bella</option>
    <option value="af_sarah">af_sarah</option>
    <option value="af_sky">af_sky</option>
    <option value="af_nicole">af_nicole</option>
    <option value="af_alloy">af_alloy</option>
    <option value="am_adam">am_adam (male)</option>
    <option value="am_echo">am_echo (male)</option>
    <option value="am_liam">am_liam (male)</option>
    <option value="am_michael">am_michael (male)</option>
    <option value="am_onyx">am_onyx (male)</option>
  </select>
  <label style="display:none" id="speedLabel">Speed: <span id="speedVal">1.0</span>x
    <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" style="width:60px;vertical-align:middle">
  </label>
  <button class="btn-primary" id="readAloudBtn" style="display:none">🎧 Read Aloud</button>
</div>

<!-- Main -->
<div class="main">
  <div class="pdf-viewer dark" id="pdfViewer">
    <canvas id="pdfCanvas"></canvas>
  </div>
  <div class="reader-panel" id="readerPanel">
    <div class="panel-header">
      <h3>📖 Audio Reader</h3>
      <span id="panelPageInfo">Page 1</span>
    </div>
    <div class="panel-controls" id="panelControls">
      <button id="playBtn">▶ Play</button>
      <button id="pauseBtn" disabled>⏸ Pause</button>
      <button id="stopBtn">⏹ Stop</button>
      <div class="generating-indicator hidden" id="genIndicator"><span class="spinner"></span> <span id="genText">Generating...</span></div>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-info"><span id="timeCurrent">0:00</span><span id="segInfo">0/0</span><span id="timeTotal">0:00</span></div>
    </div>
    <div class="paragraphs" id="paragraphsContainer">
      <div style="color:var(--muted);text-align:center;padding:40px 20px">Click "Read Aloud" on a page to start listening</div>
    </div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');
const uploadOverlay = document.getElementById('uploadOverlay');
const fileName = document.getElementById('fileName');
const pdfViewer = document.getElementById('pdfViewer');
const canvas = document.getElementById('pdfCanvas');
const ctx = canvas.getContext('2d');
const pageInfo = document.getElementById('pageInfo');
const prevPageBtn = document.getElementById('prevPageBtn');
const nextPageBtn = document.getElementById('nextPageBtn');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const zoomLabel = document.getElementById('zoomLabel');
const fitPageBtn = document.getElementById('fitPageBtn');
const darkToggle = document.getElementById('darkToggle');
const voiceSelect = document.getElementById('voiceSelect');
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const speedLabel = document.getElementById('speedLabel');
const readAloudBtn = document.getElementById('readAloudBtn');
const configSep = document.getElementById('configSep');
const readerPanel = document.getElementById('readerPanel');
const panelPageInfo = document.getElementById('panelPageInfo');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const paragraphsContainer = document.getElementById('paragraphsContainer');
const progressFill = document.getElementById('progressFill');
const timeCurrent = document.getElementById('timeCurrent');
const timeTotal = document.getElementById('timeTotal');
const segInfo = document.getElementById('segInfo');
const genIndicator = document.getElementById('genIndicator');
const genText = document.getElementById('genText');

let sessionId = null;
let pdfDoc = null;
let currentPage = 1;
let scale = 1.5;
let isDark = true;

let segments = [];
let currentSegIdx = 0;
let audioEl = null;
let isPlaying = false;
let isPaused = false;
let autoAdvance = true;
let prefetching = false;
let generatingPage = false;

// Upload handlers
uploadBox.addEventListener('click', () => fileInput.click());
uploadBox.addEventListener('dragover', e => { e.preventDefault(); uploadBox.classList.add('dragover'); });
uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
uploadBox.addEventListener('drop', e => {
  e.preventDefault(); uploadBox.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file.name.endsWith('.pdf')) return alert('Please select a PDF file');
  
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    
    sessionId = data.session_id;
    fileName.textContent = data.filename;
    uploadOverlay.classList.add('hidden');
    
    // Show config controls
    voiceSelect.style.display = '';
    speedLabel.style.display = '';
    configSep.style.display = '';
    readAloudBtn.style.display = '';
    
    // Load PDF
    const pdfRes = await fetch(`/api/pdf/${sessionId}`);
    const pdfBlob = await pdfRes.blob();
    const pdfUrl = URL.createObjectURL(pdfBlob);
    
    pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
    currentPage = 1;
    renderPage();
    
    // Enable navigation
    updateNavButtons();
    
    // Set reader panel header
    panelPageInfo.textContent = `Page 1 of ${pdfDoc.numPages}`;
    
  } catch(e) {
    alert('Upload failed: ' + e.message);
  }
}

async function renderPage() {
  if (!pdfDoc) return;
  const page = await pdfDoc.getPage(currentPage);
  const viewport = page.getViewport({ scale });
  
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  
  const renderContext = { canvasContext: ctx, viewport };
  await page.render(renderContext).promise;
  
  pageInfo.textContent = `${currentPage} / ${pdfDoc.numPages}`;
  updateNavButtons();
  panelPageInfo.textContent = `Page ${currentPage} of ${pdfDoc.numPages}`;
}

function updateNavButtons() {
  if (!pdfDoc) return;
  prevPageBtn.disabled = currentPage <= 1;
  nextPageBtn.disabled = currentPage >= pdfDoc.numPages;
}

// Navigation
prevPageBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPage(); resetReader(); }});
nextPageBtn.addEventListener('click', () => { if (pdfDoc && currentPage < pdfDoc.numPages) { currentPage++; renderPage(); resetReader(); }});

// Zoom
zoomInBtn.addEventListener('click', () => { scale = Math.min(5, scale + 0.25); zoomLabel.textContent = Math.round(scale * 100 / 1.5); renderPage(); });
zoomOutBtn.addEventListener('click', () => { scale = Math.max(0.25, scale - 0.25); zoomLabel.textContent = Math.round(scale * 100 / 1.5); renderPage(); });
fitPageBtn.addEventListener('click', () => {
  if (!pdfDoc) return;
  const vp = pdfViewer.getBoundingClientRect();
  scale = (vp.width - 80) / 612; // US Letter width points
  zoomLabel.textContent = Math.round(scale * 100 / 1.5);
  renderPage();
});

// Dark mode toggle
darkToggle.addEventListener('click', () => {
  isDark = !isDark;
  pdfViewer.classList.toggle('dark', isDark);
  pdfViewer.classList.toggle('light', !isDark);
  darkToggle.textContent = isDark ? '🌙' : '☀️';
});

// Speed slider
speedSlider.addEventListener('input', () => {
  speedVal.textContent = parseFloat(speedSlider.value).toFixed(1);
});

// ─── Audio Reader ───

readAloudBtn.addEventListener('click', async () => {
  if (!sessionId || !pdfDoc) return;
  readerPanel.classList.add('open');
  generatingPage = true;
  genIndicator.classList.remove('hidden');
  genText.textContent = `Generating page ${currentPage}...`;

  try {
    const res = await fetch('/api/generate-page', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: sessionId,
        page_num: currentPage - 1,
        voice: voiceSelect.value,
        speed: parseFloat(speedSlider.value)
      })
    });
    const data = await res.json();
    if (data.error) { genIndicator.classList.add('hidden'); alert(data.error); return; }
    
    segments = data.segments;
    generatingPage = false;
    genIndicator.classList.add('hidden');
    
    renderParagraphs();
    
    // Start prefetching next pages in background
    prefetchNextPages();
    
    // Auto-play
    currentSegIdx = 0;
    playSegment(0);
    
  } catch(e) {
    genIndicator.classList.add('hidden');
    alert('Generation failed: ' + e.message);
  }
});

function renderParagraphs() {
  paragraphsContainer.innerHTML = '';
  segments.forEach((seg, idx) => {
    const div = document.createElement('div');
    div.className = 'para';
    div.id = `para-${idx}`;
    div.textContent = seg.text;
    div.addEventListener('click', () => {
      if (audioEl) { audioEl.pause(); audioEl = null; }
      currentSegIdx = idx;
      playSegment(idx);
    });
    paragraphsContainer.appendChild(div);
  });
  segInfo.textContent = `0/${segments.length}`;
}

function playSegment(idx) {
  if (idx >= segments.length) {
    // Page done - auto advance
    if (autoAdvance && pdfDoc && currentPage < pdfDoc.numPages) {
      advanceToNextPage();
    } else {
      stopReading();
    }
    return;
  }
  
  const seg = segments[idx];
  if (!seg) return;
  
  if (audioEl) { audioEl.pause(); audioEl = null; }
  
  // Create audio element with cache-busting for fresh generation
  audioEl = new Audio(seg.audio_url + '?t=' + Date.now());
  audioEl.playbackRate = parseFloat(speedSlider.value);
  
  audioEl.play().catch(e => {
    console.log('Play error:', e);
  });
  
  isPlaying = true;
  isPaused = false;
  currentSegIdx = idx;
  updatePlayButtons();
  highlightParagraph(idx);
  updateProgress();
  
  audioEl.addEventListener('ended', () => {
    playSegment(idx + 1);
  });
  
  audioEl.addEventListener('error', () => {
    console.log('Audio error, skipping');
    playSegment(idx + 1);
  });
}

function highlightParagraph(idx) {
  document.querySelectorAll('.para.active').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.para.done').forEach(el => el.classList.remove('done'));
  
  const active = document.getElementById(`para-${idx}`);
  if (active) {
    active.classList.add('active');
    active.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  
  // Mark previous as done
  for (let i = 0; i < idx; i++) {
    const el = document.getElementById(`para-${i}`);
    if (el) el.classList.add('done');
  }
}

function updateProgress() {
  if (segments.length === 0) return;
  const pct = ((currentSegIdx) / segments.length) * 100;
  progressFill.style.width = pct + '%';
  segInfo.textContent = `${currentSegIdx}/${segments.length}`;
  
  // Time
  let elapsed = 0, total = 0;
  segments.forEach((s, i) => {
    if (i < currentSegIdx) elapsed += s.duration || 0;
    total += s.duration || 0;
  });
  timeCurrent.textContent = formatTime(elapsed);
  timeTotal.textContent = formatTime(total);
}

function updatePlayButtons() {
  playBtn.disabled = isPlaying && !isPaused;
  pauseBtn.disabled = !isPlaying || isPaused;
}

playBtn.addEventListener('click', () => {
  if (isPaused && audioEl) {
    audioEl.play();
    isPlaying = true; isPaused = false;
    updatePlayButtons();
    return;
  }
  if (segments.length > 0) playSegment(currentSegIdx);
});

pauseBtn.addEventListener('click', () => {
  if (audioEl) {
    audioEl.pause();
    isPaused = true; isPlaying = false;
    updatePlayButtons();
  }
});

stopBtn.addEventListener('click', stopReading);

function stopReading() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  isPlaying = false; isPaused = false;
  currentSegIdx = 0;
  updatePlayButtons();
  progressFill.style.width = '0%';
  timeCurrent.textContent = '0:00';
  segInfo.textContent = `0/${segments.length}`;
  document.querySelectorAll('.para.active, .para.done').forEach(el => el.classList.remove('active', 'done'));
}

function resetReader() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  isPlaying = false; isPaused = false;
  currentSegIdx = 0;
  segments = [];
  paragraphsContainer.innerHTML = '<div style="color:var(--muted);text-align:center;padding:40px 20px">Click "Read Aloud" on a page to start listening</div>';
  progressFill.style.width = '0%';
  timeCurrent.textContent = '0:00';
  segInfo.textContent = '0/0';
  timeTotal.textContent = '0:00';
  updatePlayButtons();
}

async function advanceToNextPage() {
  currentPage++;
  await renderPage();
  resetReader();
  readerPanel.classList.add('open');
  
  // Check if next page is already generated
  try {
    const statusRes = await fetch(`/api/page-status/${sessionId}/${currentPage - 1}`);
    const statusData = await statusRes.json();
    
    if (statusData.status === 'ready') {
      // Load existing
      const res = await fetch('/api/generate-page', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          page_num: currentPage - 1,
          voice: voiceSelect.value,
          speed: parseFloat(speedSlider.value)
        })
      });
      const data = await res.json();
      if (!data.error) {
        segments = data.segments;
        renderParagraphs();
        prefetchNextPages();
        currentSegIdx = 0;
        playSegment(0);
        return;
      }
    }
    
    // Need to generate
    generatingPage = true;
    genIndicator.classList.remove('hidden');
    genText.textContent = `Generating page ${currentPage}...`;
    
    const res = await fetch('/api/generate-page', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: sessionId,
        page_num: currentPage - 1,
        voice: voiceSelect.value,
        speed: parseFloat(speedSlider.value)
      })
    });
    const data = await res.json();
    if (!data.error) {
      segments = data.segments;
      generatingPage = false;
      genIndicator.classList.add('hidden');
      renderParagraphs();
      prefetchNextPages();
      currentSegIdx = 0;
      playSegment(0);
    }
  } catch(e) {
    console.log('Auto-advance error:', e);
  }
}

async function prefetchNextPages() {
  if (prefetching || !sessionId || !pdfDoc) return;
  prefetching = true;
  
  try {
    await fetch('/api/generate-next-pages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: sessionId,
        current_page: currentPage - 1,
        voice: voiceSelect.value,
        speed: parseFloat(speedSlider.value),
        n_ahead: 3
      })
    });
  } catch(e) {
    console.log('Prefetch error:', e);
  }
  prefetching = false;
}

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevPageBtn.click();
  else if (e.key === 'ArrowRight') nextPageBtn.click();
  else if (e.key === ' ' && e.target === document.body) {
    e.preventDefault();
    if (readerPanel.classList.contains('open')) {
      if (isPlaying) pauseBtn.click();
      else playBtn.click();
    }
  }
});
</script>
</body>
</html>
