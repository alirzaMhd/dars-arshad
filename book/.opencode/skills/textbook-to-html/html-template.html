<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[TOPIC NAME] - Comprehensive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; color: #e0e0e0; font-family: 'Courier New', monospace; min-height: 100vh; }
    h1 { text-align: center; font-size: 1.6em; color: #00ff88; margin: 20px 0 5px; text-shadow: 0 0 20px #00ff8855; letter-spacing: 2px; }
    .subtitle { text-align: center; color: #888; font-size: 0.9em; margin-bottom: 20px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 15px 30px; }
    .section { background: #111; border: 2px solid #333; border-radius: 12px; padding: 20px; margin: 20px 0; }
    .section h2 { color: #ff6600; font-size: 1.1em; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .section h3 { color: #ffcc00; font-size: 0.95em; margin: 15px 0 8px; }
    .formula { background: #0a0a18; padding: 12px; border-radius: 6px; margin: 10px 0; border-left: 3px solid #00ccff; }
    .formula .label { color: #00ccff; font-size: 0.85em; margin-bottom: 5px; }
    .formula .expr { color: #00ff88; font-size: 1.1em; font-weight: bold; }
    .formula .desc { color: #aaa; font-size: 0.85em; margin-top: 5px; }
    .example { background: #1a1a2e; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #444; }
    .example .title { color: #ffcc00; font-size: 0.9em; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 15px 0; }
    .card { background: #1a1a2e; padding: 15px; border-radius: 8px; border: 1px solid #444; }
    .card .highlight { color: #00ff88; font-weight: bold; }
    .card .dim { color: #ff9944; }
    .note { color: #aaa; font-style: italic; font-size: 0.85em; margin-top: 10px; }
    .result { color: #00ff88; font-weight: bold; }
    .warning { color: #ff6600; border-left: 3px solid #ff6600; padding-left: 10px; margin: 10px 0; }
    table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
    th { background: #1a1a2e; color: #00ccff; }
    td { background: #0d0d1a; }
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .tab { padding: 8px 16px; border: 2px solid #444; background: #1a1a2e; color: #e0e0e0; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85em; }
    .tab.active { border-color: #00ff88; color: #00ff88; background: #002a1a; }
    .tab:hover { border-color: #00ff88; color: #00ff88; }
    .content { display: none; }
    .content.active { display: block; }
    .code { background: #0a0a18; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 0.85em; color: #00ccff; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>[TOPIC NAME]</h1>
  <p class="subtitle">Data Structures — Complete Guide for 20/20 Exam</p>

  <div class="container">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="showSection('tab1')">Tab 1</button>
      <button class="tab" onclick="showSection('tab2')">Tab 2</button>
      <button class="tab" onclick="showSection('tab3')">Tab 3</button>
    </div>

    <!-- Tab 1 Content -->
    <div class="content active" id="tab1">
      <div class="section">
        <h2>Section Title</h2>
        
        <div class="formula">
          <div class="label">Formula:</div>
          <div class="expr">formula here</div>
          <div class="desc">Description</div>
        </div>

        <div class="example">
          <div class="title">Example 1</div>
          <p>Content here</p>
        </div>

        <div class="grid">
          <div class="card">
            <h3>Key Points</h3>
            <p>• Point 1</p>
            <p>• Point 2</p>
          </div>
          <div class="card">
            <h3>Complexity</h3>
            <p>Time: <span class="highlight">O(n)</span></p>
            <p>Space: <span class="dim">O(1)</span></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 2 Content -->
    <div class="content" id="tab2">
      <div class="section">
        <h2>Another Section</h2>
        <!-- More content -->
      </div>
    </div>

    <!-- Tab 3 Content -->
    <div class="content" id="tab3">
      <div class="section">
        <h2>Examples</h2>
        <!-- Multiple worked examples -->
      </div>
    </div>
  </div>

  <script>
    function showSection(id) {
      document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
