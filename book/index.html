<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دروس ارشد - Books</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; color: #e0e0e0; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { font-size: 2.5em; color: #00ff88; text-shadow: 0 0 30px #00ff8855; margin-bottom: 10px; }
    .subtitle { color: #888; font-size: 1em; margin-bottom: 40px; }
    .container { max-width: 800px; padding: 0 20px; text-align: center; }
    .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .card {
      background: #111; border: 2px solid #333; border-radius: 12px; padding: 30px 40px;
      text-decoration: none; color: #e0e0e0; transition: all 0.2s; display: flex;
      flex-direction: column; align-items: center; min-width: 220px;
    }
    .card:hover { border-color: #00ff88; transform: translateY(-5px); box-shadow: 0 10px 30px #00ff8811; }
    .card h2 { color: #ff6600; font-size: 1.3em; margin-bottom: 8px; }
    .card p { color: #888; font-size: 0.85em; }
    footer { margin-top: 50px; color: #555; font-size: 0.8em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 دروس ارشد</h1>
    <p class="subtitle">Master's Study Resources</p>
    <div class="cards">
      <a href="algorithm/" class="card">
        <h2>طراحی الگوریتم</h2>
        <p>Algorithm Design</p>
      </a>
      <a href="clrs/" class="card">
        <h2>CLRS</h2>
        <p>Introduction to Algorithms</p>
      </a>
      <a href="dsa/" class="card">
        <h2>ساختمان داده</h2>
        <p>Data Structures &amp; Algorithms</p>
      </a>
      <a href="dsa-exam/" class="card">
        <h2>امتحان ساختمان داده</h2>
        <p>DSA Exam Prep</p>
      </a>
      <a href="ai/" class="card">
        <h2>هوش مصنوعی</h2>
        <p>Artificial Intelligence</p>
      </a>
    </div>
    <footer>GitHub Pages &mdash; dars-arshad</footer>
  </div>
</body>
</html>
