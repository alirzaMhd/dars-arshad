.level-display .level-node.l3{border-color:#ff6600;color:#ff6600;background:#1a0a00}
.level-display .level-node.l4{border-color:#ff66ff;color:#ff66ff;background:#1a0030}
.level-display .level-node.l5{border-color:#ff6666;color:#ff6666;background:#1a0a0a}
</style>
</head>
<body>

<h1>EDMONDS-KARP ALGORITHM</h1>
<p class="subtitle">Max Flow — BFS-Based Ford-Fulkerson</p>

<div class="layout">
  <div class="main-panel">

    <div class="info-panel">
      <span class="label">Algorithm:</span> <span class="value">Edmonds-Karp</span> &nbsp;|&nbsp;
      <span class="label">Phase:</span> <span class="highlight" id="phaseDisplay">Ready — Press Play</span> &nbsp;|&nbsp;
      <span class="label">Max Flow:</span> <span class="value" id="flowDisplay">0</span>
    </div>

    <div class="graph-container">
      <svg id="graphSvg" width="620" height="340" viewBox="0 0 620 340"></svg>
    </div>

    <div class="bfs-queue-display" id="queueDisplay" style="display:none">
      <span class="bfs-queue-label">BFS Queue:</span>
      <span id="queueItems"></span>
    </div>

    <div class="level-display" id="levelDisplay" style="display:none">
      <div class="level-label" id="levelLabel">BFS Levels:</div>
      <div class="level-nodes" id="levelNodes"></div>
    </div>

    <div class="controls">
      <button class="btn primary" onclick="startAnimation()">▶ Play</button>
      <button class="btn" onclick="pauseAnimation()">⏸ Pause</button>
      <button class="btn" onclick="stepForward()">⏭ Step</button>
      <button class="btn" onclick="resetAnimation()">↺ Reset</button>
      <div class="speed-control">
        <label>Speed:</label>
        <input type="range" id="speedSlider" min="1" max="10" value="5">
        <span id="speedLabel">5x</span>
      </div>
    </div>

    <div class="step-counter">
      Step <span class="count" id="stepNum">0</span> / <span id="totalSteps">0</span>
    </div>

    <div class="flow-table-section">
      <div class="flow-table-title">Edge Flow Table</div>
      <table class="flow-table" id="flowTable"></table>
    </div>

    <div class="result-section" id="resultSection">
      <h2>Maximum Flow Found!</h2>
      <div class="big-result" id="finalFlow"></div>
      <p id="resultDetails"></p>
    </div>

  </div>

  <div class="sidebar" id="sidebar">
    <h2>📖 Step-by-Step Explanation</h2>
    <div class="step-phase" id="sidebarPhase">Algorithm idle — press Play or Step to begin.</div>
    <div id="explainArea"></div>
  </div>
</div>

<script>
const NODES = [
  { id: 's', label: 's', x: 60,  y: 170 },
  { id: 'a', label: 'a', x: 200, y: 70  },
  { id: 'b', label: 'b', x: 200, y: 270 },
  { id: 'c', label: 'c', x: 420, y: 70  },
  { id: 'd', label: 'd', x: 420, y: 270 },
  { id: 't', label: 't', x: 560, y: 170 }
];

const EDGES_DEF = [
  { from:'s', to:'a', cap:10, label:'10' },
  { from:'s', to:'b', cap:10, label:'10' },
  { from:'a', to:'b', cap:2,  label:'2'  },
  { from:'a', to:'c', cap:8,  label:'8'  },
  { from:'a', to:'d', cap:4,  label:'4'  },
  { from:'b', to:'d', cap:9,  label:'9'  },
  { from:'c', to:'t', cap:10, label:'10' },
  { from:'d', to:'c', cap:6,  label:'6'  },
  { from:'d', to:'t', cap:10, label:'10' }
];

const NODE_POS = {};
NODES.forEach(n => NODE_POS[n.id] = { x: n.x, y: n.y });

let steps = [];
let currentStep = 0;
let animating = false;
let animTimer = null;

let residual = {};
let totalFlow = 0;

function initGraph() {
  residual = {};
  EDGES_DEF.forEach(e => {
    const key = e.from + '->' + e.to;
    residual[key] = { cap: e.cap, flow: 0 };
    const rkey = e.to + '->' + e.from;
    if (!residual[rkey]) residual[rkey] = { cap: 0, flow: 0 };
  });
  totalFlow = 0;
}

function cloneResidual() {
  const r = {};
  for (const k in residual) r[k] = { cap: residual[k].cap, flow: residual[k].flow };
  return r;
}

function bfs() {
  const visited = { s: true };
  const parent = {};
  const queue = ['s'];
  const levels = { s: 0 };
  const visitOrder = ['s'];
  const bfsSteps = [];

  bfsSteps.push({
    type: 'bfs_init',
    queue: ['s'],
    visited: ['s'],
    levels: { s: 0 },
    current: null,
    parent: {}
  });

  while (queue.length > 0) {
    const u = queue.shift();
    const neighbors = [];

    for (const e of EDGES_DEF) {
      let v = null;
      if (e.from === u && residual[e.from + '->' + e.to].cap > 0) v = e.to;
      if (e.to === u && residual[e.to + '->' + e.from].cap > 0) v = e.from;
      if (v && !visited[v]) {
        visited[v] = true;
        parent[v] = u;
        levels[v] = (levels[u] || 0) + 1;
        queue.push(v);
        visitOrder.push(v);
        neighbors.push(v);
      }
    }

    bfsSteps.push({
      type: 'bfs_dequeue',
      processing: u,
      queue: [...queue],
      visited: [...visitOrder],
      levels: { ...levels },
      neighbors: neighbors,
      parent: { ...parent }
    });

    if (visited.t) break;
  }

  if (!visited.t) {
    bfsSteps.push({ type: 'bfs_no_path', queue: [], visited: [...visitOrder], levels: { ...levels }, parent: { ...parent } });
    return { found: false, steps: bfsSteps, levels: { ...levels } };
  }

  const path = [];
  let cur = 't';
  while (cur) { path.unshift(cur); cur = parent[cur]; }

  bfsSteps.push({
    type: 'bfs_path_found',
    path: path,
    queue: [],
    visited: [...visitOrder],
    levels: { ...levels },
    parent: { ...parent }
  });

  return { found: true, path, steps: bfsSteps, levels: { ...levels } };
}

function findBottleneck(path) {
  let bn = Infinity;
  for (let i = 0; i < path.length - 1; i++) {
    const key = path[i] + '->' + path[i + 1];
    bn = Math.min(bn, residual[key].cap);
  }
  return bn;
}

function pushFlow(path, bn) {
  for (let i = 0; i < path.length - 1; i++) {
    const key = path[i] + '->' + path[i + 1];
    const rkey = path[i + 1] + '->' + path[i];
    residual[key].cap -= bn;
    residual[key].flow += bn;
    residual[rkey].cap += bn;
  }
  totalFlow += bn;
}

function buildSteps() {
  steps = [];
  initGraph();

  steps.push({
    type: 'init',
    residual: cloneResidual(),
    totalFlow: 0,
    levels: {},
    path: null,
    bfsSteps: [],
    bottleneck: 0,
    explanation: buildInitExplanation()
  });

  let iteration = 0;
  while (true) {
    iteration++;
    const result = bfs();

    for (const bs of result.steps) {
      steps.push({
        type: bs.type,
        residual: cloneResidual(),
        totalFlow: totalFlow,
        levels: bs.levels || {},
        path: null,
        bfsSteps: [bs],
        bottleneck: 0,
        iteration: iteration,
        explanation: buildBfsStepExplanation(bs, iteration)
      });
    }

    if (!result.found) {
      steps.push({
        type: 'done',
        residual: cloneResidual(),
        totalFlow: totalFlow,
        levels: result.levels,
        path: null,
        bfsSteps: [],
        bottleneck: 0,
        iteration: iteration,
        explanation: buildDoneExplanation()
      });
      break;
    }

    const bn = findBottleneck(result.path);

    steps.push({
      type: 'bottleneck',
      residual: cloneResidual(),
      totalFlow: totalFlow,
      levels: result.levels,
      path: result.path,
      bfsSteps: [],
      bottleneck: bn,
      iteration: iteration,
      explanation: buildBottleneckExplanation(result.path, bn, iteration)
    });

    const preFlow = cloneResidual();
    pushFlow(result.path, bn);

    steps.push({
      type: 'augment',
      residual: cloneResidual(),
      totalFlow: totalFlow,
      levels: result.levels,
      path: result.path,
      bfsSteps: [],
      bottleneck: bn,
      iteration: iteration,
      preResidual: preFlow,
      explanation: buildAugmentExplanation(result.path, bn, iteration)
    });
  }
}

function buildInitExplanation() {
  return `
<div class="explain-section active">
  <h3>Problem Setup</h3>
  <p><b>Edmonds-Karp</b> is Ford-Fulkerson using <span class="dim">BFS</span> to find augmenting paths.</p>
  <p>Goal: Find <span class="dim">maximum flow</span> from source <span class="split-info">s</span> to sink <span class="split-info">t</span>.</p>
  <p>Key insight: BFS finds the <span class="dim">shortest augmenting path</span> (fewest edges), which prevents bad ordering and guarantees <span class="result-line" style="display:inline">O(VE²)</span> complexity.</p>
  <h3 style="margin-top:10px;">Network</h3>
  <p>Nodes: <span class="dim">s, a, b, c, d, t</span></p>
  <p>Edges labeled with <span class="split-info">capacities</span></p>
  <span class="formula-line">Residual: cap(u→v) = original capacity − flow(u→v)</span>
  <h3 style="margin-top:10px;">Algorithm</h3>
  <span class="formula-line">while (BFS finds path in G_f from s to t):<br>&nbsp;&nbsp;bn = bottleneck(path)<br>&nbsp;&nbsp;push flow along path</span>
  <p class="note">Press Play or Step to begin.</p>
</div>`;
}

function buildBfsStepExplanation(bs, iter) {
  if (bs.type === 'bfs_init') {
    return `
<div class="explain-section active">
  <h3>Iteration ${iter}: BFS Start</h3>
  <p>Starting BFS from source <span class="split-info">s</span> in residual graph.</p>
  <span class="formula-line">Queue: [s] &nbsp;|&nbsp; Visited: {s} &nbsp;|&nbsp; Level(s) = 0</span>
  <p>Explore neighbors of s with residual capacity > 0.</p>
</div>`;
  }

  if (bs.type === 'bfs_dequeue') {
    const levelInfo = bs.levels[bs.processing] !== undefined ? `Level ${bs.levels[bs.processing]}` : '';
    const neighborsInfo = bs.neighbors.length > 0
      ? `Discovered: <span class="dim">${bs.neighbors.join(', ')}</span>`
      : 'No unvisited neighbors with residual capacity';
    return `
<div class="explain-section active">
  <h3>Iteration ${iter}: Dequeue ${bs.processing.toUpperCase()} ${levelInfo}</h3>
  <p>Processing <span class="split-info">${bs.processing.toUpperCase()}</span> from BFS queue.</p>
  <span class="formula-line">Neighbors with residual cap > 0: ${bs.neighbors.length > 0 ? bs.neighbors.map(n => n.toUpperCase()).join(', ') : 'none'}</span>
  <p>${neighborsInfo}</p>
  <span class="formula-line">Queue: [${bs.queue.map(n => n.toUpperCase()).join(', ')}]</span>
  <p class="note">BFS explores level-by-level, finding shortest path first.</p>
</div>`;
  }

  if (bs.type === 'bfs_no_path') {
    return `
<div class="explain-section active">
  <h3>Iteration ${iter}: No Augmenting Path!</h3>
  <p>BFS completed — <span class="dim">sink t is unreachable</span> from s in residual graph.</p>
  <span class="formula-line">No more augmenting paths exist.</span>
  <p>Algorithm terminates. Current flow is <span class="result-line" style="display:inline">maximum</span>.</p>
  <p class="note">By Max-Flow Min-Cut theorem, we've found the max flow.</p>
</div>`;
  }

  if (bs.type === 'bfs_path_found') {
    const pathStr = bs.path.map(n => n.toUpperCase()).join(' → ');
    return `
<div class="explain-section active">
  <h3>Iteration ${iter}: Augmenting Path Found!</h3>
  <p>BFS reached sink <span class="split-info">t</span>. Reconstruct path using parent pointers.</p>
  <span class="formula-line">Path: ${pathStr}</span>
  <p>Length: <span class="dim">${bs.path.length - 1} edges</span> (shortest possible)</p>
  <p class="note">Now calculate bottleneck and push flow.</p>
</div>`;
  }

  return `<div class="explain-section active"><h3>Iteration ${iter}</h3><p>Processing...</p></div>`;
}

function buildBottleneckExplanation(path, bn, iter) {
  const pathStr = path.map(n => n.toUpperCase()).join(' → ');
  const edges = [];
  for (let i = 0; i < path.length - 1; i++) {
    const key = path[i] + '->' + path[i + 1];
    edges.push(`${path[i].toUpperCase()}→${path[i + 1].toUpperCase()}: cap=${residual[key].cap + bn}`);
  }
  return `
<div class="explain-section active">
  <h3>Iteration ${iter}: Bottleneck Calculation</h3>
  <p>Find minimum residual capacity along path:</p>
  <span class="formula-line">${pathStr}</span>
  ${edges.map(e => `<span class="formula-line">${e}</span>`).join('')}
  <span class="formula-line">Bottleneck = min(${edges.map(e => e.split('=')[1]).join(', ')}) = <span class="result-line" style="display:inline">${bn}</span></span>
  <p>Can push <span class="result-line" style="display:inline">${bn}</span> units of flow.</p>
</div>`;
}

function buildAugmentExplanation(path, bn, iter) {
  const pathStr = path.map(n => n.toUpperCase()).join(' → ');
  return `
<div class="explain-section active">
  <h3>Iteration ${iter}: Push Flow = ${bn}</h3>
  <p>Update residual network along path:</p>
  <span class="formula-line">${pathStr}</span>
  <p>For each edge (u→v) on path:</p>
  <span class="formula-line">&nbsp;&nbsp;cap(u→v) -= ${bn} &nbsp;&nbsp;(forward: less room)</span>
  <span class="formula-line">&nbsp;&nbsp;cap(v→u) += ${bn} &nbsp;&nbsp;(reverse: can undo)</span>
  <span class="formula-line">Total flow: <span class="result-line" style="display:inline">${totalFlow}</span></span>
  <p class="note">Reverse edges allow "undoing" flow in future iterations.</p>
</div>`;
}

function buildDoneExplanation() {
  return `
<div class="explain-section active" style="border-left-color:#00ff88;">
  <h3>✅ Algorithm Complete!</h3>
  <p>No more augmenting paths. Max flow = <span class="result-line" style="display:inline">${totalFlow}</span></p>
  <h3 style="margin-top:10px;">Complexity Analysis</h3>
  <p><span class="dim">Time:</span> <span class="result-line" style="display:inline">O(VE²)</span></p>
  <p style="margin-left:8px;">• Each BFS: O(E)</p>
  <p style="margin-left:8px;">• O(VE) augmentations (each edge critical O(V/2) times)</p>
  <p style="margin-left:8px;">• Total: O(VE × E) = O(VE²)</p>
  <p><span class="dim">Space:</span> <span class="result-line" style="display:inline">O(V + E)</span></p>
  <h3 style="margin-top:10px;">Why BFS?</h3>
  <p>BFS guarantees shortest augmenting paths, preventing the algorithm from taking exponentially many iterations with bad edge orderings.</p>
  <h3 style="margin-top:10px;">vs Ford-Fulkerson</h3>
  <p><span class="dim">Ford-Fulkerson:</span> O(E|f|) — depends on flow value</p>
  <p><span class="dim">Edmonds-Karp:</span> O(VE²) — polynomial, depends on graph size</p>
  <p class="note">Edmonds-Karp is always polynomial, even with irrational capacities.</p>
</div>`;
}

function renderNetwork(step) {
  const svg = document.getElementById('graphSvg');
  svg.innerHTML = '';

  const res = step.residual;
  const pathSet = new Set();
  const pathNodeSet = new Set();

  if (step.path) {
    for (let i = 0; i < step.path.length - 1; i++) {
      pathSet.add(step.path[i] + '->' + step.path[i + 1]);
      pathNodeSet.add(step.path[i]);
      pathNodeSet.add(step.path[i + 1]);
    }
  }

  const bfsData = step.bfsSteps && step.bfsSteps.length > 0 ? step.bfsSteps[0] : null;
  const visitedSet = new Set(bfsData ? bfsData.visited : []);
  const processingNode = bfsData && bfsData.type === 'bfs_dequeue' ? bfsData.processing : null;
  const queueSet = new Set(bfsData ? bfsData.queue : []);

  EDGES_DEF.forEach(e => {
    const from = NODE_POS[e.from];
    const to = NODE_POS[e.to];
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const len = Math.sqrt(dx * dx + dy * dy);
    const nx = dx / len;
    const ny = dy / len;
    const r = 24;

    const x1 = from.x + nx * r;
    const y1 = from.y + ny * r;
    const x2 = to.x - nx * r;
    const y2 = to.y - ny * r;

    const mx = (from.x + to.x) / 2;
    const my = (from.y + to.y) / 2;
    const perpX = -ny * 14;
    const perpY = nx * 14;

    const key = e.from + '->' + e.to;
    const rkey = e.to + '->' + e.from;
    const curFlow = res[key].flow;
    const curCap = res[key].cap + curFlow;
    const isSaturated = res[key].cap === 0 && curFlow > 0;
    const isPath = pathSet.has(key);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('class', 'edge-line' + (isPath ? ' path' : (isSaturated ? ' saturated' : '')));
    svg.appendChild(line);

    const arrowLen = 8;
    const arrowW = 4;
    const ax = x2 - nx * arrowLen;
    const ay = y2 - ny * arrowLen;
    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    arrow.setAttribute('points', `${x2},${y2} ${ax - ny * arrowW},${ay + nx * arrowW} ${ax + ny * arrowW},${ay - nx * arrowW}`);
    arrow.setAttribute('fill', isPath ? '#ff66ff' : (isSaturated ? '#ff4444' : '#555'));
    svg.appendChild(arrow);

    if (curFlow > 0) {
      const flowText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      flowText.setAttribute('x', mx + perpX);
      flowText.setAttribute('y', my + perpY - 5);
      flowText.setAttribute('class', 'edge-flow-label');
      flowText.textContent = curFlow;
      svg.appendChild(flowText);
    }

    const capText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    capText.setAttribute('x', mx + perpX);
    capText.setAttribute('y', my + perpY + (curFlow > 0 ? 8 : 0));
    capText.setAttribute('class', 'edge-cap-label' + (isPath ? ' path' : (isSaturated ? ' saturated' : '')));
    capText.textContent = res[key].cap;
    svg.appendChild(capText);
  });

  NODES.forEach(n => {
    const pos = NODE_POS[n.id];
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', pos.x);
    circle.setAttribute('cy', pos.y);
    circle.setAttribute('r', 22);

    let cls = 'node-circle';
    if (n.id === 's') cls += ' source';
    else if (n.id === 't') cls += ' sink';
    else if (step.type === 'path_found' || step.type === 'bottleneck' || step.type === 'augment') {
      if (pathNodeSet.has(n.id)) cls += ' path';
      else if (visitedSet.has(n.id)) cls += ' visited';
    } else if (step.type === 'bfs_dequeue' || step.type === 'bfs_init') {
      if (n.id === processingNode) cls += ' current';
      else if (queueSet.has(n.id)) cls += ' frontier';
      else if (visitedSet.has(n.id)) cls += ' visited';
    } else if (step.type === 'done') {
      cls += ' visited';
    }

    circle.setAttribute('class', cls);
    svg.appendChild(circle);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', pos.x);
    text.setAttribute('y', pos.y);
    let tcls = 'node-text';
    if (n.id === 's') tcls += ' source';
    else if (n.id === 't') tcls += ' sink';
    else if (step.type === 'path_found' || step.type === 'bottleneck' || step.type === 'augment') {
      if (pathNodeSet.has(n.id)) tcls += ' path';
      else if (visitedSet.has(n.id)) tcls += ' visited';
    } else if (step.type === 'bfs_dequeue' || step.type === 'bfs_init') {
      if (n.id === processingNode) tcls += ' current';
      else if (queueSet.has(n.id)) tcls += ' frontier';
      else if (visitedSet.has(n.id)) tcls += ' visited';
    } else if (step.type === 'done') {
      tcls += ' visited';
    }
    text.setAttribute('class', tcls);
    text.textContent = n.label;
    svg.appendChild(text);
  });
}

function renderQueue(step) {
  const display = document.getElementById('queueDisplay');
  const items = document.getElementById('queueItems');
  const bfsData = step.bfsSteps && step.bfsSteps.length > 0 ? step.bfsSteps[0] : null;

  if (!bfsData || (step.type !== 'bfs_init' && step.type !== 'bfs_dequeue')) {
    display.style.display = 'none';
    return;
  }

  display.style.display = 'flex';
  let html = '';

  if (bfsData.type === 'bfs_dequeue' && bfsData.processing) {
    html += `<span class="bfs-queue-item processing">${bfsData.processing.toUpperCase()}</span>`;
    html += `<span class="bfs-queue-arrow">→</span>`;
  }

  bfsData.queue.forEach((n, i) => {
    if (i > 0) html += `<span class="bfs-queue-arrow">,</span>`;
    html += `<span class="bfs-queue-item queued">${n.toUpperCase()}</span>`;
  });

  if (bfsData.queue.length === 0 && bfsData.type === 'bfs_dequeue') {
    html += `<span style="color:#888;font-size:0.85em">empty</span>`;
  }

  items.innerHTML = html;
}

function renderLevels(step) {
  const display = document.getElementById('levelDisplay');
  const label = document.getElementById('levelLabel');
  const nodesDiv = document.getElementById('levelNodes');

  if (!step.levels || Object.keys(step.levels).length === 0 || step.type === 'done') {
    display.style.display = 'none';
    return;
  }

  display.style.display = 'block';
  const maxLevel = Math.max(...Object.values(step.levels));
  label.textContent = `BFS Levels (max: ${maxLevel}):`;

  let html = '';
  for (let l = 0; l <= maxLevel; l++) {
    const nodesAtLevel = Object.entries(step.levels).filter(([_, lv]) => lv === l).map(([n, _]) => n);
    if (nodesAtLevel.length > 0) {
      html += `<span style="color:#888;font-size:0.8em;margin-right:4px">L${l}:</span>`;
      nodesAtLevel.forEach(n => {
        html += `<span class="level-node l${l}">${n.toUpperCase()}</span>`;
      });
      if (l < maxLevel) html += `<span style="color:#555;margin:0 2px">→</span>`;
    }
  }
  nodesDiv.innerHTML = html;
}

function renderFlowTable(step) {
  const table = document.getElementById('flowTable');
  const res = step.residual;

  let html = '<tr><th>Edge</th><th>Flow</th><th>Capacity</th><th>Residual</th><th>Status</th></tr>';

  EDGES_DEF.forEach(e => {
    const key = e.from + '->' + e.to;
    const flow = res[key].flow;
    const cap = e.cap;
    const resid = res[key].cap;
    const pct = cap > 0 ? (flow / cap * 100).toFixed(0) : 0;
    let status = '';
    let cls = '';
    if (flow === cap && cap > 0) {
      status = 'SATURATED';
      cls = 'saturated';
    } else if (flow > 0) {
      status = `${pct}%`;
      cls = 'has-flow';
    } else {
      status = '—';
    }

    html += `<tr><td>${e.from.toUpperCase()}→${e.toUpperCase()}</td><td class="${cls}">${flow}</td><td>${cap}</td><td>${resid}</td><td class="${cls}">${status}</td></tr>`;
  });

  table.innerHTML = html;
}

function applyStep(step) {
  renderNetwork(step);
  renderQueue(step);
  renderLevels(step);
  renderFlowTable(step);

  document.getElementById('flowDisplay').textContent = step.totalFlow;

  if (step.type === 'done') {
    document.getElementById('phaseDisplay').textContent = '✓ Complete!';
  } else if (step.type === 'init') {
    document.getElementById('phaseDisplay').textContent = 'Ready — Press Play';
  } else {
    const iterText = step.iteration ? `Iter ${step.iteration}` : '';
    const typeText = {
      'bfs_init': 'BFS Start',
      'bfs_dequeue': `BFS: Dequeue ${step.bfsSteps[0].processing.toUpperCase()}`,
      'bfs_no_path': 'No Path Found',
      'bfs_path_found': 'Path Found!',
      'bottleneck': `Bottleneck = ${step.bottleneck}`,
      'augment': `Push Flow = ${step.bottleneck}`
    }[step.type] || step.type;
    document.getElementById('phaseDisplay').textContent = `${iterText} — ${typeText}`;
  }

  document.getElementById('sidebarPhase').textContent = `Step ${currentStep + 1} / ${steps.length}`;
  document.getElementById('explainArea').innerHTML = step.explanation;
  document.getElementById('sidebar').scrollTop = 0;
}

function processStep() {
  if (currentStep >= steps.length) { finishAnimation(); return; }
  document.getElementById('stepNum').textContent = currentStep + 1;
  applyStep(steps[currentStep]);
  currentStep++;
}

function startAnimation() {
  if (currentStep >= steps.length) return;
  animating = true;
  animTimer = setInterval(() => {
    if (!animating || currentStep >= steps.length) {
      clearInterval(animTimer);
      if (currentStep >= steps.length) finishAnimation();
      return;
    }
    processStep();
  }, getSpeed());
}

function getSpeed() {
  return 1200 - parseInt(document.getElementById('speedSlider').value) * 100;
}

function pauseAnimation() {
  animating = false;
  clearInterval(animTimer);
}

function stepForward() {
  pauseAnimation();
  processStep();
}

function finishAnimation() {
  animating = false;
  document.getElementById('phaseDisplay').textContent = '✓ Complete!';
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('finalFlow').textContent = `Maximum Flow = ${totalFlow}`;
  document.getElementById('resultDetails').innerHTML =
    `All augmenting paths exhausted. The max flow from <b>s</b> to <b>t</b> is <b>${totalFlow}</b>.<br>` +
    `By the Max-Flow Min-Cut theorem, the minimum cut capacity equals ${totalFlow}.`;
  document.getElementById('sidebarPhase').textContent = `Step ${steps.length} / ${steps.length} — ✅ Complete`;
  document.getElementById('explainArea').innerHTML = buildDoneExplanation();
  document.getElementById('sidebar').scrollTop = 0;
}

function resetAnimation() {
  pauseAnimation();
  currentStep = 0;
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('phaseDisplay').textContent = 'Ready — Press Play';
  document.getElementById('flowDisplay').textContent = '0';
  document.getElementById('stepNum').textContent = '0';
  document.getElementById('sidebarPhase').textContent = 'Algorithm idle — press Play or Step to begin.';
  document.getElementById('explainArea').innerHTML = buildInitExplanation();
  document.getElementById('queueDisplay').style.display = 'none';
  document.getElementById('levelDisplay').style.display = 'none';
  buildSteps();
  initGraph();
  renderNetwork(steps[0]);
  renderFlowTable(steps[0]);
  document.getElementById('totalSteps').textContent = steps.length;
}

document.getElementById('speedSlider').addEventListener('input', function() {
  document.getElementById('speedLabel').textContent = this.value + 'x';
  if (animating) {
    clearInterval(animTimer);
    animTimer = setInterval(() => {
      if (!animating || currentStep >= steps.length) {
        clearInterval(animTimer);
        if (currentStep >= steps.length) finishAnimation();
        return;
      }
      processStep();
    }, getSpeed());
  }
});

buildSteps();
initGraph();
document.getElementById('totalSteps').textContent = steps.length;
document.getElementById('explainArea').innerHTML = buildInitExplanation();
renderNetwork(steps[0]);
renderFlowTable(steps[0]);
</script>
